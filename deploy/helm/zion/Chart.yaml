apiVersion: v2
name: zion
description: Zion Edge Gateway — high-performance Rust TLS reverse proxy with WAF
type: application
version: 0.2.2
appVersion: "0.7.4"
home: https://fabriziosalmi.github.io/zion
sources:
  - https://github.com/fabriziosalmi/zion
maintainers:
  - name: Fabrizio Salmi
keywords:
  - proxy
  - tls
  - waf
  - reverse-proxy
  - http3
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: Bump appVersion to 0.1.11 (process hardening — version SSOT, draconian DCO, boot-panic refactor)
    - kind: added
      description: ZION_AUDIT_HMAC_KEY wired from a Kubernetes Secret when [audit] is enabled
    - kind: added
      description: PodDisruptionBudget (minAvailable: 1)
    - kind: added
      description: Default-deny NetworkPolicy with explicit ingress + egress allowlists
    - kind: added
      description: Strict pod-level securityContext (seccomp RuntimeDefault, no NET_RAW, no SYS_ADMIN)
    - kind: added
      description: Tighter probe semantics (startupProbe + tunable timeouts)
    - kind: added
      description: emptyDir volume for /var/lib/zion (ACME state) — works with readOnlyRootFilesystem
    - kind: added
      description: topologySpreadConstraints + dedicated ServiceAccount (no automount)
