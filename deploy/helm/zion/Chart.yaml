apiVersion: v2
name: zion
description: Zion Edge Gateway — high-performance Rust TLS reverse proxy with WAF
type: application
version: 0.3.0
appVersion: "0.11.0"
home: https://fabriziosalmi.github.io/zion
sources:
  - https://github.com/fabriziosalmi/zion
maintainers:
  - name: Fabrizio Salmi
keywords:
  - proxy
  - tls
  - waf
  - reverse-proxy
  - http3
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: Render the required [tls] table from a kubernetes.io/tls Secret (tls.existingSecret, required); the chart used to render a config Zion refused, so every install crash-looped
    - kind: added
      description: HorizontalPodAutoscaler template (autoscaling.enabled was set but no HPA was rendered)
    - kind: fixed
      description: PodDisruptionBudget only when more than one replica (minAvailable 1 with one replica blocked node drains)
    - kind: fixed
      description: Probes over HTTPS (the HTTP port answers a redirect, which always passed)
    - kind: added
      description: terminationGracePeriodSeconds (default 45, covering Zion's drain)
    - kind: changed
      description: Bump appVersion to 0.11.0
    - kind: added
      description: ZION_AUDIT_HMAC_KEY wired from a Kubernetes Secret when [audit] is enabled
    - kind: added
      description: PodDisruptionBudget (minAvailable: 1)
    - kind: added
      description: Default-deny NetworkPolicy with explicit ingress + egress allowlists
    - kind: added
      description: Strict pod-level securityContext (seccomp RuntimeDefault, no NET_RAW, no SYS_ADMIN)
    - kind: added
      description: Tighter probe semantics (startupProbe + tunable timeouts)
    - kind: added
      description: emptyDir volume for /var/lib/zion (ACME state) — works with readOnlyRootFilesystem
    - kind: added
      description: topologySpreadConstraints + dedicated ServiceAccount (no automount)
