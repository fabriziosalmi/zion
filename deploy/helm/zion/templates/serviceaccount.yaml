{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zion.serviceAccountName" . }}
  labels:
    {{- include "zion.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Token is not auto-mounted into pods (CIS K8s 5.1.5). The pod spec also
# explicitly sets `automountServiceAccountToken: false` for defence in
# depth — both must align for the token to actually be absent.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
