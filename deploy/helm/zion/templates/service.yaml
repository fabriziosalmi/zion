apiVersion: v1
kind: Service
metadata:
  name: {{ include "zion.fullname" . }}
  labels:
    {{- include "zion.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (has .Values.service.type (list "LoadBalancer" "NodePort")) }}
  # Keep each client's source address (see values.yaml: service.externalTrafficPolicy).
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.portHttp }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.portHttps }}
      targetPort: https
      protocol: TCP
    - name: quic
      port: {{ .Values.service.portHttps }}
      targetPort: quic
      protocol: UDP
  selector:
    {{- include "zion.selectorLabels" . | nindent 4 }}
