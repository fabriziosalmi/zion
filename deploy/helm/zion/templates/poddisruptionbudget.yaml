{{- /* With a single replica, minAvailable: 1 can never be satisfied and blocks every
       node drain: only render the budget when there is a replica to spare. */}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int (include "zion.minReplicas" .)) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "zion.fullname" . }}
  labels:
    {{- include "zion.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "zion.selectorLabels" . | nindent 6 }}
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
{{- end }}
