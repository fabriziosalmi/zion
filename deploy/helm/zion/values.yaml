# Zion Edge Gateway — Helm values.
#
# Defaults are conservative-secure:
#   - Distroless image @ UID/GID 65532, no shell, no SUID.
#   - readOnlyRootFilesystem with an emptyDir for /var/lib/zion (ACME state).
#   - All Linux capabilities dropped; seccomp = RuntimeDefault.
#   - automountServiceAccountToken disabled (no Kubernetes API access from the pod).
#   - PodDisruptionBudget protecting at least one replica during voluntary disruptions.
#   - NetworkPolicy in default-deny mode for both ingress and egress; the chart
#     opens 80/443 on ingress and the named upstream egress block on egress.
#
# Override anything in this file via `helm install -f my-values.yaml`.

replicaCount: 2

image:
  repository: ghcr.io/fabriziosalmi/zion
  pullPolicy: IfNotPresent
  # Empty = inherit Chart.appVersion (kept in sync by CI).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Pods do not need K8s API access. Disabling the automount removes the
  # token from the pod filesystem entirely (CIS K8s 5.1.5).
  automountServiceAccountToken: false
  annotations: {}
  name: ""

# Pod-level security context. Mirrors the distroless image's UID/GID and
# pins fsGroup so emptyDir / projected volumes are owned by the same user
# the binary runs as. seccompProfile = RuntimeDefault enables the kernel's
# stock syscall filter without requiring a custom profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. Distroless already satisfies most of
# this, but K8s admission webhooks (PSA / OPA / Kyverno) generally check
# the explicit fields here.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
    # Left empty on purpose. The container binds the UNPRIVILEGED ports in
    # `containerPorts` below (>= 1024), so a non-root pod with ALL caps
    # dropped needs no NET_BIND_SERVICE. Only if you override containerPorts
    # back to 80/443 must you add the capability here — and keep it in sync
    # with those ports (that mismatch is exactly what this default avoids).
    # add:
    #   - NET_BIND_SERVICE

# Ports the Zion process binds INSIDE the container. Unprivileged by default
# so the pod runs non-root with every Linux capability dropped and never needs
# NET_BIND_SERVICE. The Service still presents 80/443 to the world (see
# `service` below) and targets these by NAME, so external clients are
# unaffected. The daemon's own listen addresses are derived from these values
# in the ConfigMap, so the three can't drift out of sync. If you must bind
# 80/443 in-container, set these to 80/443 AND add NET_BIND_SERVICE above.
containerPorts:
  http: 8080
  https: 8443

podAnnotations: {}
podLabels: {}

service:
  type: LoadBalancer
  portHttp: 80
  portHttps: 443
  # Annotations for cloud LB (e.g. NLB on AWS, GCLB on GCP). Empty by default.
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Tight enough to spot regressions, loose enough to absorb load spikes.
# Override per environment.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Schedule replicas across zones (or hostnames if zones aren't labeled).
# `whenUnsatisfiable: ScheduleAnyway` keeps the pods schedulable on
# clusters that don't expose a topology label.
topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# Voluntary-disruption budget. With replicaCount >= 2 (the default) at
# least one pod is always available during rolling drains.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # If you prefer percentages: set `maxUnavailable: 50%` and unset minAvailable.
  maxUnavailable: ""

# Default-deny NetworkPolicy. Override `egress.upstreams` to match the
# CIDRs / namespaces / labels of the services Zion proxies to. Egress
# DNS (kube-system / 53) is allowed by default so cluster-internal DNS
# resolution still works.
networkPolicy:
  enabled: true
  # Pod selector for ingress sources. Empty = allow from anywhere on
  # the listed ports (typical for an edge proxy).
  ingress:
    fromAll: true
    fromNamespaces: []
    fromPodSelectors: []
  egress:
    # By default we only allow DNS (kube-system :53) and explicit
    # upstream blocks below. Add CIDRs / namespace selectors here.
    upstreams: []
    # CIDRs for off-cluster upstreams (e.g. SaaS APIs).
    cidrs: []

# Probe tuning. Conservative defaults — bump initial / failure thresholds
# if the daemon is slow to start because of ACME bootstrap.
probes:
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 30
    periodSeconds: 1
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# /var/lib/zion holds ACME state — the account key and the renewed
# certificate/key pair — plus the panic last-gasp file.
#
# By default it is an emptyDir: fine when TLS is terminated at the LB and Zion
# does NOT run ACME in-pod, but EPHEMERAL — wiped whenever the pod is
# rescheduled (node drain, eviction, rolling update onto a new node). If Zion
# renews certificates itself, an emptyDir means the ACME account key and certs
# are lost on every reschedule, forcing re-registration and re-issuance that
# quickly trips the CA's rate limits (Let's Encrypt: a handful of duplicate
# certs per week). Enable persistence to keep that state across restarts.
#
# NOTE: a PVC is ReadWriteOnce, so a single volume cannot back more than one
# replica. For in-pod ACME with persistence, run replicaCount: 1 (or switch to
# a StatefulSet / an external cert-manager Secret). Multi-replica deployments
# should terminate TLS at the LB or source certs from a shared Secret and leave
# persistence disabled.
persistence:
  enabled: false
  # Reuse an existing PVC instead of letting the chart create one.
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 64Mi
  # storageClassName: ""   # "" = cluster default; "-" = disable dynamic provisioning
  annotations: {}

# Size cap for the emptyDir used when persistence.enabled = false.
varlib:
  sizeLimit: 16Mi

# Zion configuration — projected as a ConfigMap and mounted at /etc/zion.
# The listen addresses are NOT set here: they are derived from `containerPorts`
# in the ConfigMap so the bound ports, the declared containerPorts, and the
# Service targetPorts stay consistent by construction.
config:
  # You can mount a Secret and define certificates paths here
  # cert_path: "/etc/ssl/zion/tls.crt"
  # key_path: "/etc/ssl/zion/tls.key"
  upstreams: {}
  routes: []

# Optional: seal the audit-log HMAC key into a Kubernetes Secret. The
# chart sets ZION_AUDIT_HMAC_KEY from this secret when `audit.enabled`.
audit:
  enabled: false
  # Secret name + key. Operator creates the Secret out of band.
  hmacKey:
    secretName: ""
    secretKey: hmac-key
