[package]
name = "zion-bpf-demux"
version = "0.1.0"
edition = "2021"
description = "SK_REUSEPORT eBPF demux for Zion's :443 listener group (issue #53)"
publish = false

# Standalone cargo project that targets `bpfel-unknown-none` and
# requires `bpf-linker` — same layout as `xdp/zion-xdp-prog/`. Build
# via `bpf/build.sh`. Not part of the zion package's workspace.
[workspace]

[dependencies]
aya-ebpf = "0.1"

[[bin]]
name = "zion-bpf-demux"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
