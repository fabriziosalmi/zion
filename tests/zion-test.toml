# Zion config for functional testing — all features enabled
[server]
listen_http = "0.0.0.0:8080"
listen_https = "0.0.0.0:4433"

[tls]
cert_path = "./benchmarks/certs/tls.crt"
key_path = "./benchmarks/certs/tls.key"
hot_reload = false

[upstreams]
backend = "http://127.0.0.1:9090"

# API with WAF
[[route]]
path = "/api/{*rest}"
upstream = "backend"
mode = "standard"
waf = true
max_body_mb = 10

# SSE streaming
[[route]]
path = "/api/v1/events/stream"
upstream = "backend"
mode = "sse_stream"

# Static with cache
[[route]]
path = "/_next/static/{*rest}"
upstream = "backend"
mode = "static_cache"

# Internal-only (metrics)
[[route]]
path = "/metrics"
upstream = "backend"
internal_only = true

# Root path
[[route]]
path = "/"
upstream = "backend"
mode = "standard"

# Catch-all (HTML/SSR)
[[route]]
path = "/{*rest}"
upstream = "backend"
mode = "standard"
