# Zion config for functional testing — all features enabled
[server]
listen_http = "0.0.0.0:8080"
listen_https = "0.0.0.0:4433"

[tls]
cert_path = "./benchmarks/certs/tls.crt"
key_path = "./benchmarks/certs/tls.key"
hot_reload = false

[upstreams]
backend = "http://127.0.0.1:9090"

# Streaming WAF profile (issue #49). Frame-by-frame scan with early
# deny when an injection pattern lands in the first chunk.
[waf_profile.streamed]
streaming = true
max_body_mb = 10
# Body shapes the streaming bench/integration uses are not JSON; keep the
# allowed list permissive so requests reach gate 3 (Aho-Corasick).
allowed_content_types = ["application/json", "multipart/form-data", "text/plain"]
# Disable entropy + JSON gates so the integration-test deny is purely
# attributable to the streaming AC scan.
entropy_check = false

# API with WAF
[[route]]
path = "/api/{*rest}"
upstream = "backend"
mode = "standard"
waf = true
max_body_mb = 10

# Streaming-WAF route (issue #49). Body inspection happens chunk-by-chunk;
# attacks in the first chunk deny without reading the rest of the upload.
[[route]]
path = "/stream/{*rest}"
upstream = "backend"
mode = "standard"
waf_profile = "streamed"

# SSE streaming
[[route]]
path = "/api/v1/events/stream"
upstream = "backend"
mode = "sse_stream"

# Static with cache
[[route]]
path = "/_next/static/{*rest}"
upstream = "backend"
mode = "static_cache"

# Static file serving from disk (ADR-0015). Regression guard for the dispatch
# 503 gap: a mode=static route has no upstream, so it must skip the
# upstream-health gate and reach the file server.
[[route]]
path = "/assets/{*rest}"
mode = "static"
serve_dir = "./tests/fixtures/static"

# Internal-only (metrics)
[[route]]
path = "/metrics"
upstream = "backend"
internal_only = true

# Root path
[[route]]
path = "/"
upstream = "backend"
mode = "standard"

# Catch-all (HTML/SSR)
[[route]]
path = "/{*rest}"
upstream = "backend"
mode = "standard"
