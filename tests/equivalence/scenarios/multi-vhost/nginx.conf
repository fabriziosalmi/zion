# Equivalence scenario: multi-vhost.
# Three name-based vhosts + a default_server catch-all + one multi-location
# API vhost. Every backend answers with its own name, so "which backend
# replied" IS the routing decision. Backend hostnames resolve on the harness
# docker network (zeq-net).
server {
    listen 80;
    server_name alpha.example.com;
    location / {
        proxy_pass http://zeq-be-alpha:5678;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name beta.example.com;
    location / {
        proxy_pass http://zeq-be-beta:5678;
    }
}

server {
    listen 80;
    server_name api.example.com;
    # NB: not /healthz — Zion reserves that path for its own health endpoint,
    # so it never reaches a route. /status is a plain proxied path.
    location = /status {
        proxy_pass http://zeq-be-health:5678;
    }
    location /v1/users {
        proxy_pass http://zeq-be-users:5678;
    }
    location /v1/ {
        proxy_pass http://zeq-be-legacy:5678;
    }
}

server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_pass http://zeq-be-default:5678;
    }
}
