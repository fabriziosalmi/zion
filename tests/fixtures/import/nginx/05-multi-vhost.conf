# Corpus 05 — multi-tenant vhosting: several server blocks, one file.
# Exercises: the v0.5.0 synergy (server_name -> hosts), a default_server catch-all
# (maps to Zion's hostless shared layer), and per-vhost backends on the same paths.
server {
    listen 80;
    server_name alpha.example.com;
    location / {
        proxy_pass http://10.0.1.10:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name beta.example.com;
    location / {
        proxy_pass http://10.0.1.20:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_pass http://10.0.1.99:8080;
    }
}
