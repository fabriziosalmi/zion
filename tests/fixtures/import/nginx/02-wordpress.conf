# Corpus 02 — WordPress in a container behind nginx (reverse-proxy flavor, not fastcgi).
# Exercises: client_max_body_size (uploads), proxy timeouts, buffering directives,
# a denied dotfile location (no proxy_pass -> what does the converter do?).
server {
    listen 80;
    server_name blog.example.com www.blog.example.com;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    location ~ /\.ht {
        deny all;
    }
}
