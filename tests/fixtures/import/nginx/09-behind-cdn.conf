# Corpus 09 — origin behind a CDN/edge (Cloudflare-style): trusted proxies + real IP.
# Exercises: set_real_ip_from list -> trusted_proxies, real_ip_header ->
# xff handling, limit_conn -> per-IP connection cap, gzip (WARN/none).
limit_conn_zone $binary_remote_addr zone=peraddr:10m;

server {
    listen 80;
    server_name origin.example.com;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 2400:cb00::/32;
    real_ip_header CF-Connecting-IP;

    limit_conn peraddr 20;

    gzip on;
    gzip_types text/plain application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
