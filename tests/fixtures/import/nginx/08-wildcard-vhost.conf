# Corpus 08 — wildcard vhost + apex, mirrors Zion's v0.5.0 wildcard semantics.
# Exercises: server_name *.example.com (-> hosts wildcard), apex on a separate
# server, and a wildcard cert shared via SNI.
server {
    listen 443 ssl;
    server_name *.tenants.example.com;

    ssl_certificate     /etc/ssl/wildcard.tenants.example.com.crt;
    ssl_certificate_key /etc/ssl/wildcard.tenants.example.com.key;

    location / {
        proxy_pass http://tenant-router:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name tenants.example.com;

    ssl_certificate     /etc/ssl/wildcard.tenants.example.com.crt;
    ssl_certificate_key /etc/ssl/wildcard.tenants.example.com.key;

    location / {
        proxy_pass http://landing:3000;
    }
}
