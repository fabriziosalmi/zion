# Corpus 04 — classic SPA deployment: static files served by nginx + /api proxied.
# Exercises the HONESTY contract: root/try_files/index/expires are UNSUPPORTED
# (Zion is a proxy, not a web server) and must surface loudly in the report,
# while the /api location must still convert cleanly.
server {
    listen 80;
    server_name spa.example.com;

    root /var/www/spa/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location /assets/ {
        expires max;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
