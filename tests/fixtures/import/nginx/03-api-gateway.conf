# Corpus 03 — API gateway: one vhost, many prefix locations to different backends.
# Exercises: multiple locations, exact-match location, per-endpoint rate limiting
# (limit_req zone defined in http{} context), add_header on responses.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name api.example.com;

    location = /healthz {
        proxy_pass http://127.0.0.1:9000;
    }

    location /v1/users {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://users-svc:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/orders {
        limit_req zone=api burst=40;
        proxy_pass http://orders-svc:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://legacy-monolith:8000;
        add_header X-Gateway "zion" always;
    }
}
