# Corpus 07 — TLS termination with the standard http->https redirect pair.
# Exercises: listen 443 ssl (+http2), ssl_certificate/key -> tls paths, ssl protocol
# pins (WARN or map), the port-80 redirect server (Zion does this built-in -> note,
# don't emit a route), HSTS via add_header.
server {
    listen 80;
    server_name secure.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name secure.example.com;

    ssl_certificate     /etc/letsencrypt/live/secure.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass https://10.0.3.10:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
