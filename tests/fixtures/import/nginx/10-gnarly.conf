# Corpus 10 — the hostile one: everything the converter must SURVIVE and flag,
# never silently mistranslate and never crash on.
# Exercises: regex locations (with braces in the regex), if{}, rewrite, map{},
# variables in proxy_pass, error_page, auth_basic, custom log_format, include.
map $http_user_agent $is_bot {
    default 0;
    "~*bot|crawler|spider" 1;
}

log_format gateway '$remote_addr - $request [$time_local] "$is_bot"';

server {
    listen 80;
    server_name gnarly.example.com;

    access_log /var/log/nginx/gnarly.log gateway;
    error_page 502 503 /50x.html;

    auth_basic "restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    if ($is_bot) {
        return 403;
    }

    # nginx requires quoting when a location regex contains braces.
    location ~ "^/user/(\d{4,8})/profile$" {
        proxy_pass http://profiles:8080;
    }

    rewrite ^/old-path/(.*)$ /new-path/$1 permanent;

    location /dynamic/ {
        set $target http://dynamic-backend:8080;
        proxy_pass $target;
    }

    location /okay/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_set_header Host $host;
    }
}
