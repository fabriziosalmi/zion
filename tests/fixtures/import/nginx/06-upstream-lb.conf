# Corpus 06 — load-balanced upstream pool.
# Exercises: upstream{} block -> [upstream.X] urls, least_conn strategy mapping,
# server weights/backup flags (approximate or WARN), keepalive.
upstream backend_pool {
    least_conn;
    server 10.0.2.11:8080 weight=3;
    server 10.0.2.12:8080;
    server 10.0.2.13:8080 backup;
    keepalive 32;
}

server {
    listen 80;
    server_name lb.example.com;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502;
    }
}
