# Zion profile: TLS + WAF (no cache)
[server]
listen_http = "0.0.0.0:8081"
listen_https = "0.0.0.0:4431"

[tls]
cert_path = "./benchmarks/certs/tls.crt"
key_path = "./benchmarks/certs/tls.key"
hot_reload = false

[upstreams]
backend = "http://127.0.0.1:9090"
frontend = "http://127.0.0.1:9090"

# WAF profile for the corpus route. Balanced mode (the detection baseline), with the
# multipart structure limits tightened so the #694 CVE request-shapes are caught at a
# realistic size, and lenient on content-types so a non-form-data multipart smuggle
# (Spring CVE-2026-41853) reaches the multipart structure gate rather than being stopped
# earlier by the content-type gate. Non-multipart detection is unchanged.
[waf_profile.corpus]
deny_unknown_content_types = false
max_body_mb = 10
max_parts = 20
max_file_parts = 10
max_part_headers = 6
max_part_header_bytes = 512
deny_field_names = ["PHP_SESSION_UPLOAD_PROGRESS"]

[[route]]
path = "/api/{*rest}"
upstream = "backend"
mode = "standard"
waf_profile = "corpus"

[[route]]
path = "/_next/static/{*rest}"
upstream = "frontend"
mode = "standard"
waf = false

[[route]]
path = "/{*rest}"
upstream = "frontend"
mode = "standard"
waf = false
