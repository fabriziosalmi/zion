<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zion — Benchmark Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #0f1117; color: #e1e4e8; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; color: #f0f0f0; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 20px; }
  .meta { display: flex; gap: 20px; margin-bottom: 16px; font-size: 12px; color: #9ca3af; }
  .meta .stat { background: #1a1d27; padding: 8px 14px; border-radius: 6px; border: 1px solid #2d3140; }
  .meta .stat strong { color: #60a5fa; }
  .meta .stat.best strong { color: #34d399; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 8px 12px; background: #1a1d27; color: #9ca3af; font-weight: 500;
             font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #2d3140; }
  tbody td { padding: 7px 12px; border-bottom: 1px solid #1e2130; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #1a1d27; }
  tbody tr:first-child { background: #111827; }
  .commit { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; color: #60a5fa; }
  .branch { font-size: 11px; color: #6b7280; }
  .ts { font-size: 11px; color: #6b7280; }
  .rps { font-weight: 600; color: #e5e7eb; }
  .delta { font-size: 11px; font-weight: 500; margin-left: 4px; }
  .delta.up { color: #34d399; }
  .delta.down { color: #f87171; }
  .delta.flat { color: #6b7280; }
  .best-row { color: #34d399; }
  .sparkline { display: inline-block; vertical-align: middle; margin-left: 6px; }
  .bar { display: inline-block; width: 3px; margin-right: 1px; background: #3b82f6; border-radius: 1px; vertical-align: bottom; }
  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; color: #6b7280; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .legend .l-tls::before { background: #3b82f6; }
  .legend .l-waf::before { background: #f59e0b; }
  .legend .l-cache::before { background: #10b981; }
  .legend .l-html::before { background: #8b5cf6; }
  #error { color: #f87171; padding: 20px; display: none; }
  .empty { text-align: center; padding: 40px; color: #6b7280; }
</style>
</head>
<body>

<h1>Zion — Benchmark Dashboard</h1>
<p class="subtitle">Performance tracking across commits · Auto-refreshes every 30s</p>

<div class="meta" id="meta"></div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Commit</th>
      <th>Branch</th>
      <th>Date</th>
      <th>TLS Proxy</th>
      <th>WAF POST</th>
      <th>Cache Hit</th>
      <th>HTML</th>
      <th>Trend</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="legend">
  <span class="l-tls">TLS Proxy</span>
  <span class="l-waf">WAF POST</span>
  <span class="l-cache">Cache Hit</span>
  <span class="l-html">HTML</span>
</div>

<div id="error"></div>

<script>
const METRICS = ['tls_proxy_rps', 'waf_post_rps', 'cache_hit_rps', 'html_rps'];
const COLORS  = ['#3b82f6',       '#f59e0b',       '#10b981',        '#8b5cf6'];
const LABELS  = ['TLS Proxy',     'WAF POST',      'Cache Hit',      'HTML'];

function fmt(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toString();
}

function deltaHtml(current, previous) {
  if (!previous || previous === 0) return '';
  const pct = ((current / previous) - 1) * 100;
  if (Math.abs(pct) < 2) return '<span class="delta flat">—</span>';
  const cls = pct > 0 ? 'up' : 'down';
  const sign = pct > 0 ? '+' : '';
  return `<span class="delta ${cls}">${sign}${pct.toFixed(0)}%</span>`;
}

function sparkline(history, metric, maxH = 16) {
  const vals = history.map(h => h[metric] || 0);
  const max = Math.max(...vals, 1);
  const colorIdx = METRICS.indexOf(metric);
  const color = COLORS[colorIdx] || '#3b82f6';
  return vals.map(v => {
    const h = Math.max(2, (v / max) * maxH);
    return `<span class="bar" style="height:${h}px;background:${color}"></span>`;
  }).join('');
}

function render(data) {
  const tbody = document.getElementById('tbody');
  const meta = document.getElementById('meta');

  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No benchmark data yet. Run: bash benchmarks/bench-smoke.sh</td></tr>';
    return;
  }

  // Reverse: newest first
  const rows = [...data].reverse();

  // Find all-time bests
  const bests = {};
  METRICS.forEach(m => { bests[m] = Math.max(...data.map(d => d[m] || 0)); });

  // Meta stats
  const latest = rows[0];
  meta.innerHTML = `
    <div class="stat">Runs: <strong>${data.length}</strong></div>
    <div class="stat best">Best TLS: <strong>${fmt(bests.tls_proxy_rps)}</strong> req/s</div>
    <div class="stat best">Best Cache: <strong>${fmt(bests.cache_hit_rps)}</strong> req/s</div>
    <div class="stat">Latest: <strong>${latest.commit}</strong></div>
  `;

  // Render rows
  tbody.innerHTML = rows.map((row, idx) => {
    const prev = rows[idx + 1]; // previous chronologically = next in reversed array
    const rowIdx = data.length - idx;
    const isBest = METRICS.some(m => (row[m] || 0) === bests[m] && bests[m] > 0);

    const ts = row.timestamp ? new Date(row.timestamp).toLocaleString('it-IT', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    }) : '—';

    return `<tr${idx === 0 ? ' style="background:#111827"' : ''}>
      <td style="color:#4b5563">${rowIdx}</td>
      <td><span class="commit">${row.commit || '—'}</span></td>
      <td><span class="branch">${row.branch || '—'}</span></td>
      <td><span class="ts">${ts}</span></td>
      <td><span class="rps${(row.tls_proxy_rps||0) === bests.tls_proxy_rps ? ' best-row' : ''}">${fmt(row.tls_proxy_rps||0)}</span>${deltaHtml(row.tls_proxy_rps, prev?.tls_proxy_rps)}</td>
      <td><span class="rps${(row.waf_post_rps||0) === bests.waf_post_rps ? ' best-row' : ''}">${fmt(row.waf_post_rps||0)}</span>${deltaHtml(row.waf_post_rps, prev?.waf_post_rps)}</td>
      <td><span class="rps${(row.cache_hit_rps||0) === bests.cache_hit_rps ? ' best-row' : ''}">${fmt(row.cache_hit_rps||0)}</span>${deltaHtml(row.cache_hit_rps, prev?.cache_hit_rps)}</td>
      <td><span class="rps${(row.html_rps||0) === bests.html_rps ? ' best-row' : ''}">${fmt(row.html_rps||0)}</span>${deltaHtml(row.html_rps, prev?.html_rps)}</td>
      <td>${METRICS.map(m => sparkline(data, m)).join('')}</td>
    </tr>`;
  }).join('');
}

function load() {
  fetch('bench-history.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'Failed to load bench-history.json: ' + e.message;
    });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
