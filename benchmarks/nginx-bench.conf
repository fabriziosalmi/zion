# nginx benchmark config — MAXIMUM PERFORMANCE
# Every knob tuned to give nginx its absolute best shot.

worker_processes 1;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;               # Linux optimal (ignored on macOS)
}

http {
    # ── TCP tuning ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Keepalive ──
    keepalive_timeout 65;
    keepalive_requests 100000;    # was 10000 — allow more reuse

    # ── Logging off ──
    access_log off;
    error_log /dev/null crit;

    # ── Buffer tuning (critical for proxy perf) ──
    proxy_buffering on;
    proxy_buffer_size 16k;        # first part of response (headers)
    proxy_buffers 8 32k;          # 8 buffers × 32KB = 256KB per connection
    proxy_busy_buffers_size 64k;

    # ── Timeouts ──
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # ── Upstream (connection pooling to backend) ──
    upstream backend {
        server bench-backend:9090;
        keepalive 256;            # was 64 — match Zion's pool_max_idle_per_host
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bench.local;

        # ── TLS ──
        ssl_certificate /etc/ssl/bench/tls.crt;
        ssl_certificate_key /etc/ssl/bench/tls.key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # ── TLS session cache (critical — avoids full handshake on reconnect) ──
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets on;

        # ── Proxy ──
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
