services:
  # ========================================
  # SHARED BACKEND (Go, minimal, fast)
  # ========================================
  bench-backend:
    build: ./backend
    cpus: 2.0
    mem_limit: 512m
    networks:
      - benchnet

  # ========================================
  # SCENARIO 5: nginx baseline (TLS + proxy)
  # ========================================
  nginx:
    image: nginx:1.27-alpine
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "8443:443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/bench:ro
    depends_on:
      - bench-backend
    networks:
      - benchnet

  # ========================================
  # SCENARIO 7: nginx + ModSecurity + CRS
  # ========================================
  nginx-modsec:
    image: owasp/modsecurity-crs:nginx-alpine
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "8444:443"
    volumes:
      - ./nginx-modsec/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-modsec/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./certs:/etc/ssl/bench:ro
    environment:
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
    depends_on:
      - bench-backend
    networks:
      - benchnet

  # ========================================
  # SCENARIO 6 & 7: Varnish (cache layer)
  # Sits in front of nginx (8080 plain HTTP)
  # ========================================
  varnish:
    image: varnish:7.5-alpine
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "8081:80"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    command: ["varnishd", "-F", "-a", ":80", "-f", "/etc/varnish/default.vcl", "-s", "malloc,128M"]
    depends_on:
      - nginx
      - nginx-modsec
    networks:
      - benchnet

  # ========================================
  # SCENARIO 6: nginx + Varnish
  # Varnish:80 -> nginx:8080 (plain HTTP, no TLS between them)
  # ========================================
  # For this scenario we need nginx to also listen on 8080 without TLS.
  # We add an additional server block via a separate config.

  # ========================================
  # Varnish with TLS termination (haproxy or stunnel in front)
  # For fair comparison, we add a TLS terminator in front of Varnish
  # ========================================
  varnish-tls:
    image: nginx:1.27-alpine
    cpus: 1.0
    mem_limit: 128m
    ports:
      - "8445:443"
    volumes:
      - ./nginx/varnish-tls-terminator.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/bench:ro
    depends_on:
      - varnish
    networks:
      - benchnet

networks:
  benchnet:
    driver: bridge
