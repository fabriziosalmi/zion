worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream varnish {
        server varnish:80;
        keepalive 64;
    }

    # TLS terminator in front of Varnish (for fair benchmark: client always talks TLS)
    server {
        listen 443 ssl http2;
        server_name bench.local;

        ssl_certificate /etc/ssl/bench/tls.crt;
        ssl_certificate_key /etc/ssl/bench/tls.key;
        ssl_protocols TLSv1.3;

        location / {
            proxy_pass http://varnish;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
