# ============================================================================
# Zion Edge Gateway — GitLab CI/CD
# ============================================================================
# Pipeline: check → test → build → docker → release
#
# - Runs on every push (check + test)
# - Docker build on main/master
# - Release artifacts on tags (v*)
# ============================================================================

stages:
  - check
  - test
  - build
  - docker
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Docker
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

# ── Cache: shared Cargo registry + target between jobs ──
.rust_cache: &rust_cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/
    policy: pull-push

# ============================================================================
# Stage: CHECK (fast feedback — syntax, lints, formatting)
# ============================================================================

cargo:check:
  stage: check
  image: rust:1.86-bookworm
  <<: *rust_cache
  script:
    - rustup component add rustfmt clippy
    - cargo fmt -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo check
    - cargo check --features acme
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================================================
# Stage: TEST (unit tests — both default and acme feature)
# ============================================================================

cargo:test:
  stage: test
  image: rust:1.86-bookworm
  <<: *rust_cache
  script:
    - cargo test
    - cargo test --features acme
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================================================
# Stage: BUILD (release binaries — linux amd64 + arm64)
# ============================================================================

.build_template: &build_template
  stage: build
  image: rust:1.86-bookworm
  <<: *rust_cache
  script:
    - cargo build --release --features acme
    - strip target/release/zion
    - mv target/release/zion zion-linux-${ARCH}
  artifacts:
    paths:
      - zion-linux-${ARCH}
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:linux-amd64:
  <<: *build_template
  variables:
    ARCH: amd64
  tags:
    - linux-amd64

build:linux-arm64:
  <<: *build_template
  variables:
    ARCH: arm64
  tags:
    - linux-arm64
  before_script:
    - rustup target add aarch64-unknown-linux-gnu
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
  script:
    - cargo build --release --features acme --target aarch64-unknown-linux-gnu
    - aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/zion
    - mv target/aarch64-unknown-linux-gnu/release/zion zion-linux-${ARCH}

# ============================================================================
# Stage: DOCKER (multi-arch image)
# ============================================================================

docker:build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
    # Tag as latest on default branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
        docker push "${IMAGE_NAME}:latest"
      fi
    # Tag with version on release tags
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:${CI_COMMIT_TAG}"
        docker push "${IMAGE_NAME}:${CI_COMMIT_TAG}"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# Stage: RELEASE (GitLab release with binary artifacts)
# ============================================================================

release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:linux-amd64
    - build:linux-arm64
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    name: "Zion ${CI_COMMIT_TAG}"
    description: |
      ## Zion Edge Gateway ${CI_COMMIT_TAG}

      ### Downloads
      - **Linux amd64**: `zion-linux-amd64`
      - **Linux arm64**: `zion-linux-arm64`
      - **Docker**: `docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}`

      See [CHANGELOG](CHANGELOG.md) for details.
    assets:
      links:
        - name: "zion-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/zion-linux-amd64?job=build:linux-amd64"
          link_type: package
        - name: "zion-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/zion-linux-arm64?job=build:linux-arm64"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
