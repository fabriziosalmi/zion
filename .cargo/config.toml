# Which processor the compiler may assume, per target.
#
# aarch64 (Linux, the BSDs): nothing here, so the compiler's default, ARMv8.0 with NEON.
# This file used to say `target-cpu=neoverse-n1` (ARMv8.2) for them, and such a binary
# stops with an illegal instruction on a Cortex-A53 or a Cortex-A72: Raspberry Pi 3 and
# 4, Graviton 1 (issue #666). On a Neoverse N2 the default gnu build costs 1 to 7 % more
# CPU on cached responses and nothing measurable on proxied requests, WAF bodies and TLS
# handshakes; the default musl build up to 6 % on all but the handshake
# (docs/deploy/index.md). The difference between the two: on gnu, atomics go through a
# helper that uses the LSE instructions where the processor has them (`outline-atomics`,
# the compiler's default there); on musl, rustc 1.88 has no such default and they are
# exclusive pairs everywhere, until the toolchain pin moves to a compiler that has it
# (1.98 does).
#
# x86_64 (Linux, the BSDs, Windows): nothing here, so the compiler's default, the x86-64
# baseline (SSE2). This file used to say `target-cpu=x86-64-v3` (AVX2, BMI2, FMA: Haswell,
# 2013) for them. A binary built that way stops with an illegal instruction on a processor
# without AVX2, before it prints a word: older Xeons, and the Atom-class Celeron and Pentium
# boxes common as home servers and edge appliances. What the flag bought was measured on
# v0.12.0 (issue #662, docs/deploy/index.md): nothing outside the noise on six workloads of
# seven, one to three percent of CPU on the seventh, and no microbenchmark faster with it
# beyond noise (the WAF body scan was 10 % slower). The TLS library and the byte searches pick their
# AES-NI / AVX2 code when the process starts, whatever this file says.
#
# To build for the machine you are on:
#
#     RUSTFLAGS="-C target-cpu=native" cargo build --release
#
# That binary runs on that processor family and newer. `zion bootstrap` lists what a binary
# assumes (build_target_features), and scripts/cpu-baseline-smoke.sh refuses one that assumes
# more than its target's baseline: the release and .github/workflows/cpu-baseline.yml run it
# on every Linux artefact, under an emulated baseline processor.
#
# A function that is measurably faster with AVX2 gets a `#[target_feature]` version chosen
# with `is_x86_feature_detected!`, not a build-wide flag.

# macOS: the developer hosts. `native` is for local builds only; the released macOS binaries
# are built with an explicit `-C target-cpu` (release.yml), which replaces these.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
