# cargo-deny — supply chain policy for Zion Edge Gateway.
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny --all-features check
#
# CI: see .github/workflows/supply-chain.yml
#
# Policy posture: STRICT. Anything new that violates this file blocks merge.
# We deliberately keep the allowlist short and the denylist explicit so a
# reviewer reading this file sees the *whole* trust surface in one place.

# ─────────────────────────────────────────────────────────────────────────────
# graph: which targets/features participate in the dep graph we audit.
# ─────────────────────────────────────────────────────────────────────────────
[graph]
# All first-class deployment targets. CI cross-compiles to all of these,
# so we audit them all — no "it only fails on Linux musl" surprises.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Audit *every* feature combination, not just the default. acme/auth/http3/tui
# pull non-trivial dependency closures (instant-acme, jsonwebtoken, quinn,
# ratatui) — those must be policy-clean too.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────────────
# advisories: RustSec advisory DB. Zero tolerance.
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Severity policy: every advisory category is a hard fail unless explicitly
# ignored below with a reason. cargo-deny's defaults treat `unmaintained`,
# `unsound`, and `notice` as warnings — we promote them to errors so the
# policy matches `cargo audit --deny warnings unmaintained unsound yanked`.
yanked = "deny"
ignore = [
    # Format: { id = "...", reason = "..." }
    #
    # Every accepted exception MUST have a written reason that includes a
    # re-evaluation date. The supply-chain workflow re-runs daily; the dated
    # reason serves as the manual review checkpoint.
    #
    # ── Unmaintained transitive deps (no safe upgrade currently available) ──
    { id = "RUSTSEC-2024-0384", reason = "[review by 2026-09-01] `instant` is unmaintained but pulled in transitively only (no direct dep). Informational, no actual vulnerability. Re-evaluate after upstream deps migrate to `web-time`." },
    { id = "RUSTSEC-2024-0436", reason = "[review by 2026-09-01] `paste` is unmaintained but pulled in transitively as a proc-macro (no runtime surface). No replacement consensus in the ecosystem yet. Track upstream replacement." },
    # ── Direct dep that needs migration to a new API ──
    { id = "RUSTSEC-2025-0134", reason = "[review by 2026-08-01] `rustls-pemfile` is archived; replacement is `rustls-pki-types::pem::PemObject`. Migration tracked as a follow-up task in src/tls.rs and src/acme.rs. Not a vulnerability." },
    # ── Soundness issue in transitive dep (TUI feature only) ──
    { id = "RUSTSEC-2026-0002", reason = "[review by 2026-08-01] `lru` 0.12.5 has a Stacked Borrows soundness issue in `IterMut`. Pulled in transitively by `ratatui` (TUI feature only — not in default build). Not exploitable through Zion's surface; the `lru` API used is read-mostly cache. Track upstream `ratatui` bump." },
    # ── Soundness issue in transitive dep (ml-waf feature only) ──
    { id = "RUSTSEC-2026-0186", reason = "[review by 2026-09-01] `memmap2 0.9.10` unchecked pointer offset (unsound). Pulled in transitively by `tract-onnx` (ml-waf feature only — off by default, not in the audiolibri/edge build). No fixed release published yet. Track upstream `tract-onnx`/`memmap2` bump." },
    { id = "RUSTSEC-2026-0217", reason = "[review by 2026-09-01] `tract-nnef 0.21.14` integer overflow in the NNEF tensor parser → out-of-bounds read on model load. Pulled in transitively by `tract-onnx` (ml-waf feature only — off by default, not in the audiolibri/edge build). Same scope and provenance as RUSTSEC-2026-0186; only reachable when loading an NNEF model with ml-waf enabled, not on Zion's request path. No fixed release published yet. Track upstream `tract` bump." },
    # ── Pulled in by aimp_node (--features sovereign-aimp, off by default) ──
    { id = "RUSTSEC-2024-0437", reason = "[review by 2026-09-01] `protobuf 2.28.0` recursion-DoS via `prometheus 0.13.4` → `aimp_node`. Only reachable when the experimental `sovereign-aimp` feature is enabled (off by default). Upstream `aimp_node` tracks the migration to `prometheus 0.14` which uses `protobuf 3.7.x`; accept the transitive risk on the experimental track until that lands." },
    { id = "RUSTSEC-2024-0320", reason = "[review by 2026-09-01] `yaml-rust 0.4.5` unmaintained, pulled in via `config 0.13.4` → `aimp_node`. Same scope as RUSTSEC-2024-0437: only when `sovereign-aimp` is enabled. Replacement (`yaml-rust2`) is a drop-in but requires upstream `aimp_node` to bump `config`. Tracking upstream." },
]

# ─────────────────────────────────────────────────────────────────────────────
# licenses: SPDX policy. Permissive only. No copyleft in the binary.
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
# Be conservative — confidence below 0.93 means we're guessing.
confidence-threshold = 0.93
# Allowlist (SPDX). Reviewed once, mirrored across the cargo ecosystem.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",     # used transitively by some -sys crates; see [[licenses.exceptions]]
    "MPL-2.0",     # weak copyleft, file-level — acceptable for libraries we don't fork
]

# Per-crate exceptions for licenses that need a narrower scope (i.e. allowed
# only for *that* crate, not globally). Keep this list short and explained.
exceptions = [
    # ring/aws-lc-sys ship a bespoke license bundle (ISC/MIT/OpenSSL).
    # We only consume them via rustls/aws-lc-rs.
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "aws-lc-sys" },
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "aws-lc-fips-sys" },
]

# Flag unlicensed crates as hard errors rather than warnings — a silent gap
# in the license metadata is the same risk as a forbidden license.
unused-allowed-license = "allow"

# ─────────────────────────────────────────────────────────────────────────────
# bans: explicit denylist + duplicate detection. Catches typo-squats and
# regressions where a dep accidentally pulls a second copy of a critical crate.
# ─────────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"      # warn — Cargo legitimately resolves to multiple
                                # major versions during ecosystem migrations
                                # (e.g. rand 0.8/0.9). Tracked, not blocking.
wildcards = "deny"              # `foo = "*"` in deps is forbidden — every
                                # version must be reproducibly resolved.
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Explicitly denied crates. Anything here is a tripwire — if it shows up in a
# transitive dep graph, the build fails and a human investigates.
deny = [
    # Unmaintained / known-vulnerable historical crates
    { crate = "openssl",            reason = "Use rustls/aws-lc-rs. We are an OpenSSL-free build." },
    { crate = "openssl-sys",        reason = "Same as openssl — would re-introduce a C TLS stack." },
    { crate = "native-tls",         reason = "Pulls platform TLS — we want deterministic rustls only." },
    { crate = "tokio-native-tls",   reason = "Same as native-tls." },
    { crate = "hyper-tls",          reason = "Use hyper-rustls instead." },
    { crate = "git2",               reason = "Pulls libssh2/libgit2 C surface unrelated to a proxy." },
    # Common typo-squats we never want to see resolved
    { crate = "tokio_tls",          reason = "typo-squat of tokio-native-tls" },
    { crate = "rusttls",            reason = "typo-squat of rustls" },
]

# Skip duplicate-version warnings *only* for crates where the ecosystem still
# carries multiple incompatible majors. Each entry needs a reason.
skip = [
    # Empty by design — populate with `{ crate = "foo@0.1.0", reason = "..." }`
    # if a duplicate is unavoidable. Re-evaluate every release.
]

skip-tree = [
    # Empty by design — same rule, but for a whole subtree.
]

# ─────────────────────────────────────────────────────────────────────────────
# sources: only crates.io and the upstream Rust mirrors. No vendored git deps.
# ─────────────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = [
    # AIMP serverless control plane (`--features sovereign-aimp`).
    # Pinned to a specific commit (see Cargo.toml). Promote to a
    # crates.io publish + version-pinned dep when AIMP cuts a stable
    # release.
    "https://github.com/fabriziosalmi/aimp",
]

