# Dependabot — automated dependency updates with grouping for sane review load.
#
# Strategy:
#   - Cargo (root): weekly minor/patch version updates in two groups, at most
#     3 open PRs; manual majors. Security updates are separate and not limited
#     by this setting.
#   - Actions, Docker, npm, pip, benchmarks: version updates are PAUSED
#     (open-pull-requests-limit: 0) for now, see the note at each entry. A
#     limit of 0 only stops version updates; security updates still open.
#
# Auto-merge (.github/workflows/dependabot-auto-merge.yml) covers PATCH
# updates of cargo and npm only, ungrouped, once every required check is green. Anything
# else, GitHub Actions and Docker included, waits for a human. #537.
#
# All PRs land with the standard reviewers/labels so the supply-chain
# pipeline (.github/workflows/supply-chain.yml) re-runs cargo-audit/deny
# before merge — Dependabot never bypasses policy.

version: 2
updates:
  # ── Rust crates ───────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    # The freeze for the v0.7.4 field-validation window ended long ago (this is
    # 0.9.x); it left routine updates unproposed and let dependencies drift into
    # larger, riskier batches. Every `ignore` rule below still stands: they
    # encode walls (toml_parser/edition2024 at 0.9.0, tract-onnx vs the 1.88
    # anchor, aws-lc-rs vs the unvalidated FIPS 4.x module). A low limit keeps
    # the review load small while the first batches land.
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"
    # Group routine bumps so the queue stays readable. Majors stay individual
    # so they get scrutinized.
    groups:
      rust-patch:
        applies-to: "version-updates"
        update-types: ["patch"]
      rust-minor:
        applies-to: "version-updates"
        update-types: ["minor"]
      rust-security:
        applies-to: "security-updates"
        update-types: ["patch", "minor", "major"]
    ignore:
      # hyper-rustls 0.27.8+ raised its MSRV to rustc 1.85, which collides
      # with our MSRV-core 1.82 anchor (ADR-0007, "do not relitigate"). Hold
      # at 0.27.7 (rustc 1.71) until MSRV-core moves to 1.85. The MSRV CI gate
      # is the hard guard; this rule just stops Dependabot re-proposing it.
      - dependency-name: "hyper-rustls"
        versions: [">=0.27.8"]
      # dashmap 6.2.0+ raised its MSRV to rustc 1.85 (interim v6 maintenance
      # release before v7), colliding with the 1.82 anchor. Hold at 6.1.x
      # until MSRV-core moves to 1.85. Same posture as hyper-rustls above.
      - dependency-name: "dashmap"
        versions: [">=6.2.0"]
      # hyper-util 0.1.21 is edition 2024 (rustc 1.85): the MSRV job fails at
      # manifest parse, before any code compiles (seen on the first Dependabot
      # batch, #610). Hold at 0.1.20 until MSRV-core moves to 1.85. Same posture
      # as hyper-rustls and dashmap above.
      - dependency-name: "hyper-util"
        versions: [">=0.1.21"]
      # zeroize 1.9.0 is edition 2024 (rustc 1.85): the MSRV job fails at manifest parse
      # (#611). Hold at 1.8.x until MSRV-core moves to 1.85, as for hyper-util above.
      - dependency-name: "zeroize"
        versions: [">=1.9.0"]
      # criterion 0.8 raised its MSRV to rustc 1.86, well past the 1.82
      # anchor. It's a dev/bench-only dependency with no runtime value, so
      # hold at 0.5.x rather than relitigate MSRV for a benchmark harness.
      - dependency-name: "criterion"
        versions: [">=0.6.0"]
      # simd-json 0.15+ raised its MSRV to rustc 1.85 (via value-trait 0.12,
      # edition2024) against the 1.82 anchor — the MSRV job fails at manifest
      # parse, before any code compiles. Hold at 0.14.x. Same posture as above.
      - dependency-name: "simd-json"
        versions: [">=0.15.0"]
      # toml is blocked transitively, by `toml_parser` — not by its own MSRV.
      # The wall starts at 0.9.0, not 1.0.0 as first written: 0.9.0 is where
      # the parser was split out into `toml_parser ^1.0.0` (default `parse`
      # feature), and that caret resolves to 1.1.x, which is edition2024 /
      # rustc 1.85 — past the 1.82 anchor. The MSRV job then fails at manifest
      # parse, before any code compiles: #362 (toml 1.0.7) and #367 (toml
      # 0.9.12) both died on exactly that line, and 0.9.x slipped past the
      # old >=1.0.0 floor. Note toml_parser 1.1.x is ALREADY in the lock via
      # proc-macro-crate -> toml_edit 0.25, but that path sits outside the
      # no-default-features graph, so cargo never opens its manifest; toml 0.9
      # moves it onto the direct, non-optional config path where cargo must.
      # Pinning the transitive down to 1.0.x is more upkeep than a build-time
      # config parser earns, so hold at 0.8.x until MSRV-core moves to 1.85.
      - dependency-name: "toml"
        versions: [">=0.9.0"]
      # tract-onnx 0.23+ requires rustc 1.91, past the FULL-feature 1.88
      # anchor (rust-toolchain.toml) — a different wall from the ones above,
      # since ml-waf is excluded from the no-default-features MSRV job. 0.22.x
      # (rustc 1.85) stays proposable. Revisit when ml-waf leaves EXPERIMENTAL.
      - dependency-name: "tract-onnx"
        versions: [">=0.23.0"]
      # Pin major-version bumps for the cryptographic / network core — those
      # need a manual security review (release notes, advisory diff) before merge.
      - dependency-name: "rustls"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hyper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aws-lc-rs"
        update-types: ["version-update:semver-major"]
      # aws-lc-rs 1.18.0 switches `aws-lc-fips-sys` from the AWS-LC-FIPS 3.x
      # branch to 4.x. 3.x is FIPS 140-3 VALIDATED (NIST certificates #5314
      # static, #5298 dynamic); 4.x has completed lab testing and is submitted,
      # but sits on the CMVP Modules In Process list — not yet certified.
      #
      # `--features fips` exists precisely to give operators a validated module,
      # and README, docs/guide/architecture.md and docs/security/fips.md all say
      # "validated" in so many words. Taking 1.18 would make those claims false
      # while the PR title read like routine maintenance ("rust-minor group").
      # Upstream's own guidance: pin to <1.18.0 to stay on the 3.x module.
      #
      # Note this is a SEPARATE condition from the semver-major pin above, which
      # exists for a different reason (manual security review of crypto majors).
      # When NIST certifies 4.0, delete this entry only — the other still stands.
      - dependency-name: "aws-lc-rs"
        versions: [">=1.18.0"]

  # Benchmarks workspace has its own Cargo.toml — keep it on the same cadence.
  - package-ecosystem: "cargo"
    directory: "/benchmarks/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "rust", "benchmarks"]
    commit-message:
      prefix: "deps(bench)"
      include: "scope"
    # Version updates PAUSED, not forgotten: `0` stops them for this ecosystem
    # and leaves security updates alone. Cargo (root) was resumed first (#537);
    # the others follow once its first weeks show the review load is small.
    open-pull-requests-limit: 0  # was 5

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
      include: "scope"
    # Version updates PAUSED, not forgotten: `0` stops them for this ecosystem
    # and leaves security updates alone. Cargo (root) was resumed first (#537);
    # the others follow once its first weeks show the review load is small.
    open-pull-requests-limit: 0  # was 5
    groups:
      actions:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]

  # ── Docker base image ─────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"
      include: "scope"
    # Version updates PAUSED, not forgotten: `0` stops them for this ecosystem
    # and leaves security updates alone. Cargo (root) was resumed first (#537);
    # the others follow once its first weeks show the review load is small.
    open-pull-requests-limit: 0  # was 5

  # ── VitePress docs site ───────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docs"]
    commit-message:
      prefix: "docs"
      include: "scope"
    # Version updates PAUSED, not forgotten: `0` stops them for this ecosystem
    # and leaves security updates alone. Cargo (root) was resumed first (#537);
    # the others follow once its first weeks show the review load is small.
    open-pull-requests-limit: 0  # was 3
    versioning-strategy: "increase-if-necessary"

  # ── Python ML training pipeline (ml/requirements.txt → ml/requirements.lock) ──
  # Nothing here ships into the Zion binary (tract-onnx does inference in
  # production), but the pipeline pulls torch/onnx/numpy/requests, which have
  # their own advisory stream. Declared so version + security updates are
  # proposed once the freeze below lifts; active advisory detection runs in the
  # `pip-audit` CI job regardless of this limit.
  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "ml"
      include: "scope"
    # Version updates PAUSED, consistent with the other ecosystems above.
    open-pull-requests-limit: 0  # was 5
