# Run the profile-guided build the way the release does, before a tag does.
#
# The `-pgo` artefact is built only by release.yml, on a tag: a training that no longer
# completes, a profile that stopped covering the code, or a flag lost on the way would be
# found while publishing. The v0.12.0 one was compiled without the target-cpu of
# .cargo/config.toml and against the runner's glibc (2.38, the plain artefact needs 2.28),
# and nothing looked.
# This job runs scripts/pgo-build.sh with the release's toolchain and the release's checks
# on every pull request that touches the pipeline, then builds a second time from the
# profile alone and compares the two binaries: what docs/perf/pgo.md promises a verifier.
#
# If the toolchain pins below change, change them in release.yml in the same commit.
name: pgo

on:
  pull_request:
    paths:
      - "scripts/pgo-build.sh"
      - "scripts/pgo-train.sh"
      - "scripts/cpu-baseline-smoke.sh"
      - "scripts/remap-rustflags.sh"
      - "scripts/check-build-date.sh"
      - "benchmarks/backend/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/pgo.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TARGET: x86_64-unknown-linux-gnu
  PGO_TARGET: x86_64-unknown-linux-gnu
  PGO_CARGO: cargo zigbuild
  PGO_GENERATE_LINKER: cc
  PGO_CARGO_TEST: cargo-zigbuild test
  PGO_MAX_GLIBC: "2.28"

jobs:
  pgo:
    name: PGO build as the release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same inputs release.yml gives the build.
      - name: Build environment (commit time and stamp)
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)"
            echo "ZION_GIT_SHA=$(git rev-parse --short=12 HEAD)"
            echo "ZION_COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)"
          } >> "$GITHUB_ENV"
          rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: pgo

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          # No cache of zig's cache: the action restores compiled C objects of an earlier
          # run, and one of them has its compile time in it (scripts/check-build-date.sh).
          use-cache: false

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Install build deps and the training's load generator
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential nghttp2-client
          go version

      # The training sends megabytes a second over the loopback interface, whose MTU is
      # 65536. On these runners (ubuntu-24.04, kernel 6.17 azure) a receiving socket's buffer
      # now and then ends up smaller than one such segment: the segments are dropped, the
      # sender retransmits on its timer, and one connection crawls for minutes. Measured on
      # the phase "files over HTTP/2": late in 10 runs of 58 with zion and in 19 of 166 with
      # nginx serving the same files (so it is not the server), in none of 250 with the
      # loopback at a network's MTU. The profile is the same either way (99.8 % overlap).
      - name: Loopback at a network's MTU for the training
        run: |
          sudo ip link set dev lo mtu 1500
          ip link show lo | head -1

      # As release.yml: the runner's paths out of the binary, and an empty zig cache (#669).
      - name: Keep this runner's paths out of the binary
        run: |
          var="CARGO_TARGET_$(tr 'a-z.-' 'A-Z__' <<<"$TARGET")_RUSTFLAGS"
          echo "${var}=$(bash scripts/remap-rustflags.sh)" | tee -a "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=${RUNNER_TEMP}/zig-cache" | tee -a "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=${RUNNER_TEMP}/zig-cache" | tee -a "$GITHUB_ENV"

      - name: PGO build (instrumented build, training, optimised build, checks, tests)
        env:
          PGO_TEST: "1"
        run: |
          PGO_OUT="${RUNNER_TEMP}/pgo" bash scripts/pgo-build.sh
          cp "target/${TARGET}/release/zion" "${RUNNER_TEMP}/zion-first"

      # As release.yml does for every binary it builds (#662): the PGO binary must declare
      # the compiler's defaults for its target and serve under an emulated processor that
      # has SSE2 and nothing later. Up to v0.12.0 it was the one x86_64 build that did,
      # by mistake; the profile must not be what takes that away.
      - name: CPU baseline (declared, and served under an emulated baseline CPU)
        run: |
          sudo apt-get install -y qemu-user >/dev/null
          bash scripts/cpu-baseline-smoke.sh "${RUNNER_TEMP}/zion-first"
          bash scripts/check-build-date.sh "${RUNNER_TEMP}/zion-first"

      # A release is rebuilt from the profile published with it, kept somewhere else, by
      # someone who has nothing of the first build: the target directory goes first, or
      # cargo would find every dependency fresh and this would compare one build with itself.
      - name: Build again from the profile alone
        run: |
          rm -rf "target/${TARGET}"
          mkdir -p "${RUNNER_TEMP}/elsewhere"
          cp "${RUNNER_TEMP}/pgo/zion.profdata" "${RUNNER_TEMP}/elsewhere/published.profdata"
          PGO_PROFDATA="${RUNNER_TEMP}/elsewhere/published.profdata" PGO_OUT="${RUNNER_TEMP}/pgo-again" bash scripts/pgo-build.sh

      - name: Compare the two binaries
        run: |
          first="$(sha256sum "${RUNNER_TEMP}/zion-first" | cut -d' ' -f1)"
          again="$(sha256sum "target/${TARGET}/release/zion" | cut -d' ' -f1)"
          {
            echo "### PGO build, twice from one profile (${TARGET})"
            echo
            echo "| | sha256 of the binary |"
            echo "|---|---|"
            echo "| trained and built | \`${first}\` |"
            echo "| rebuilt from the profile | \`${again}\` |"
            echo
            echo "rustc $(rustc --version), zig $(zig version)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$first" == "$again" ]]; then
            echo "Reproduced: ${again}"
          else
            echo "::error::The binary rebuilt from the profile differs from the first one"
            # Where they differ, so that the cause can be read from the log: the count of differing
            # bytes, the sections they fall in, and the text that is in one binary only.
            a="${RUNNER_TEMP}/zion-first"
            b="target/${TARGET}/release/zion"
            cp "$b" "${RUNNER_TEMP}/zion-again"
            echo "sizes: $(stat -c %s "$a") and $(stat -c %s "$b") bytes; differing bytes: $(cmp -l "$a" "$b" | wc -l)"
            for sec in $(readelf -SW "$a" | sed -n 's/^ *\[ *[0-9]*\] \(\.[^ ]*\) .*/\1/p'); do
              objcopy -O binary --only-section="$sec" "$a" /tmp/sec-a 2>/dev/null || continue
              objcopy -O binary --only-section="$sec" "$b" /tmp/sec-b 2>/dev/null || continue
              cmp -s /tmp/sec-a /tmp/sec-b || echo "  section $sec: $(cmp -l /tmp/sec-a /tmp/sec-b | wc -l) differing bytes of $(stat -c %s /tmp/sec-a)"
            done
            echo "text in one binary only (first 40 lines):"
            diff <(strings -n 8 "$a") <(strings -n 8 "$b") | grep '^[<>]' | cut -c1-240 | head -40 || true
            exit 1
          fi

      - name: Keep the logs and the binaries when it fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgo-logs
          path: |
            ${{ runner.temp }}/pgo/*.log
            ${{ runner.temp }}/pgo-again/*.log
            ${{ runner.temp }}/zion-first
            ${{ runner.temp }}/zion-again
          retention-days: 14
