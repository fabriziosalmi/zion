name: DCO

on:
  pull_request:
    branches: [master]

# Default token gets read-only access to repository contents. The job below
# only needs git history to walk commits and check for sign-off — no writes.
permissions:
  contents: read

jobs:
  dco-check:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=""
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              subj=$(git log -1 --format='%s' "$sha")
              missing+="  ${sha:0:12}  ${subj}"$'\n'
            fi
          done < <(git log --no-merges --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          if [ -n "$missing" ]; then
            echo "::error::One or more commits are missing a Signed-off-by trailer."
            echo ""
            echo "Commits without sign-off:"
            echo "$missing"
            echo "Per the Developer Certificate of Origin (https://developercertificate.org/),"
            echo "all commits must be signed off."
            echo ""
            echo "  - Sign new commits with:    git commit -s"
            echo "  - Fix existing commits in a branch with:"
            echo "      git rebase --signoff ${BASE_SHA}"
            echo "    then force-push the branch."
            exit 1
          fi

          echo "All commits are signed off."
