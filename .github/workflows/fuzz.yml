# Fuzz — build every cargo-fuzz harness, then run each one.
#
# A pull request or push that touches a fuzzed module runs every target for 60 s; the
# weekly schedule (and a manual dispatch) runs each for 10 minutes. A crash fails the job
# and its input is uploaded as the `fuzz-artifacts` artifact; reproduce it locally with
# `cargo +nightly fuzz run --fuzz-dir fuzz <target> fuzz/artifacts/<target>/crash-...`.
#
# To run a target locally:
#   rustup install nightly
#   cargo install --locked cargo-fuzz
#   cargo +nightly fuzz run --fuzz-dir fuzz uri_normalize -- -max_total_time=60
#   (on a machine whose PATH finds a non-rustup cargo first, put ~/.cargo/bin first)
#
# Targets:
#   - traceparent_parser : W3C parser, panic & invariant checks
#   - redact_query_string: PII redactor, panic & pair-count check
#   - audit_chain_verify : HMAC signing determinism
#   - uri_normalize      : the accepted path is canonical, has no dot segment (also after the
#                          upstream decodes it once) and none of the refused bytes
#   - waf_stream_vs_whole: the streaming WAF + prescanned pipeline denies exactly when the
#                          whole-body WAF does, for any body and chunk size (a mismatch is a
#                          bypass)

name: fuzz

on:
  push:
    branches: [master]
    paths:
      - "fuzz/**"
      - "src/observability.rs"
      - "src/audit.rs"
      - "src/waf.rs"
      - "src/uri_norm.rs"
      - "src/lib.rs"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [master]
    paths:
      - "fuzz/**"
      - "src/observability.rs"
      - "src/audit.rs"
      - "src/waf.rs"
      - "src/uri_norm.rs"
      - "src/lib.rs"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "29 3 * * 0" # Sundays 03:29 UTC: 10 minutes per target
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: cargo-fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the dev compiler to 1.88, which shadows the
      # nightly default *inside the checkout* — so `cargo install cargo-fuzz`
      # would build under 1.88 and fail (cargo-fuzz's cargo-platform dep now
      # needs rustc >= 1.91). This whole job is a nightly job, so drop the pin
      # and let the nightly installed below apply to every cargo invocation.
      # Same pattern as release.yml's "Drop dev toolchain pin" step.
      - name: Drop dev toolchain pin (this job builds on nightly)
        run: rm -f rust-toolchain.toml

      # cargo-fuzz requires nightly because libfuzzer-sys uses unstable
      # rustc internals for its #[no_main] runtime. We don't run fuzz
      # campaigns here — only verify the harness compiles.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: fuzz
          workspaces: "fuzz -> target"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential libssl-dev
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Build all fuzz targets
        # `cargo fuzz build` compiles every `[[bin]]` in fuzz/Cargo.toml
        # under the libfuzzer sanitizer. A signature drift in the public
        # zion library breaks this step.
        run: cargo +nightly fuzz build --fuzz-dir fuzz
      - name: Run every target
        env:
          # 60 s each on a PR or push, 10 minutes each on the weekly schedule / manual run.
          SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::fuzz $target (${SECONDS_PER_TARGET}s)"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- \
              -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
