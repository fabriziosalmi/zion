# Release — cross-compiled binaries + signed multi-arch container,
# with SLSA Level 3 provenance and CycloneDX SBOM attestation.
#
# Triggered by:
#   - push of a tag matching v*  (canonical release path)
#   - manual workflow_dispatch   (dry-runs and re-runs)
#
# The pipeline produces, per release tag:
#   1. Statically-linked binaries for 7 targets:
#        x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl,
#        aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl,
#        x86_64-apple-darwin, aarch64-apple-darwin,
#        x86_64-pc-windows-msvc
#   2. SHA256SUMS file (GNU coreutils format) over every artifact.
#   3. CycloneDX SBOM (zion-sbom.cdx.json) covering the dependency closure.
#   4. SLSA v1.0 build provenance (in-toto attestation) for every binary
#      via `actions/attest-build-provenance` (GitHub-hosted Sigstore + Rekor).
#   5. Multi-arch (amd64 + arm64) OCI image pushed to GHCR, keyless-signed
#      with cosign (Fulcio cert + Rekor inclusion proof) plus SBOM
#      attestation bound to the image digest.
#
# Verification steps for downstream users live in docs/security/supply-chain.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release (tag or sha). Required for dry-runs."
        required: true
        default: "master"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # 1. Build cross-compiled binaries.
  #    - linux-gnu/musl x86_64+aarch64 via cargo-zigbuild (handles aws-lc-rs
  #      cross-compilation via Zig's toolchain — no QEMU, no Docker cross).
  #    - macOS x86_64+aarch64 native on the macos runners.
  #    - Windows x86_64 native via MSVC.
  # ════════════════════════════════════════════════════════════════════════
  build:
    name: build (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write          # Sigstore OIDC for attestation step (below)
      attestations: write      # actions/attest-build-provenance writes here
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          # Linux musl (fully static — runs on Alpine, distroless, scratch)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          # macOS — native runners; one Intel, one Apple Silicon.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: native
            artifact: zion
            pgo: false
          - target: aarch64-apple-darwin
            os: macos-15
            cross: native
            artifact: zion
            pgo: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: native
            artifact: zion.exe
            pgo: false
          # ── PGO variants (issue #55) ──────────────────────────────
          # Profile-Guided Optimization: a two-pass build trains the
          # release binary on a deterministic 10s workload via
          # scripts/pgo-collect.sh. Ships alongside the regular binary
          # with a `-pgo` archive suffix so operators can pick it
          # explicitly. Currently only x86_64-unknown-linux-gnu is
          # PGO'd — it's the most common server target and the
          # ubuntu-latest runner can natively execute the
          # instrumented binary to collect profiles. musl + aarch64
          # variants will follow once the wire-up has run a few
          # release cycles cleanly.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: native
            artifact: zion
            pgo: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (tag or dispatch ref)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # We don't need history for the build, but provenance needs the
          # exact tag commit. Default fetch-depth=1 already provides it.

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Prefer the actual tag name; fall back to the dispatch input,
          # finally to a synthetic dev tag so dry-runs always have a version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.ref }}" ]]; then
            v="dev-$(git rev-parse --short HEAD)"
          else
            v="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Building Zion ${v} for ${{ matrix.target }}"

      - name: Reproducible-build epoch
        id: epoch
        shell: bash
        # SOURCE_DATE_EPOCH = commit timestamp. Tools that respect it (the Rust
        # compiler, strip, archivers, OCI image builders) will emit identical
        # output bit-for-bit across rebuilds of the same commit.
        run: |
          ts=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${ts}" >> "$GITHUB_ENV"
          echo "epoch=${ts}" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml in the repo root pins the dev compiler to 1.88.
      # On a release tag we want the toolchain dtolnay/rust-toolchain installs
      # (latest stable) instead, AND we need it to install the matrix target.
      # When rust-toolchain.toml is present, dtolnay's `targets:` is ignored
      # by `rustup`, so we drop the file for this job and add the target
      # explicitly. The dev override resumes for non-release builds.
      - name: Drop dev toolchain pin for release builds
        shell: bash
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # `llvm-tools` ships rustc's *own* `llvm-profdata`, whose raw
          # profile format always matches the compiler that wrote the
          # `.profraw` files. A system llvm-profdata can be older (profraw
          # version mismatch → "no profile can be merged"). Needed by the
          # PGO merge step; harmless on the non-PGO legs.
          components: llvm-tools

      - name: Install matrix target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # ring 0.17 sanity-checks static target_features at compile time and
      # fails on `target-cpu=native` runners where the host's feature set
      # disagrees with ring's MIN_STATIC_FEATURES baseline. The repo's
      # .cargo/config.toml sets `target-cpu=native` for Apple Silicon for
      # local dev speed; for redistributable release binaries we override
      # with the M1 baseline (always present on every Apple Silicon shipped
      # since 2020) so the resulting binary runs on every M-series chip.
      - name: Pin RUSTFLAGS for redistributable Apple Silicon binary
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: echo "RUSTFLAGS=-C target-cpu=apple-m1" >> "$GITHUB_ENV"
      - name: Pin RUSTFLAGS for redistributable Intel macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV"

      # ── Cross-compile path: zigbuild handles musl + aarch64 + aws-lc-rs ──
      - name: Setup zigbuild
        if: matrix.cross == 'zig'
        # NOTE: v2.2.1 is still a Node 20 action (mlugg/setup-zig has no Node 24
        # release yet), so GitHub's Node-20 deprecation warning persists for this
        # step until upstream migrates — it runs forced-on-node24 meanwhile.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.cross == 'zig'
        run: cargo install --locked cargo-zigbuild

      # ── Native build deps ──
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        # `gnu-tar` provides `gtar`, used by the Stage step below — the
        # macOS default `/usr/bin/tar` is bsdtar which doesn't accept
        # `--mtime=@<epoch>` (GNU syntax) or `--sort=name`.
        run: brew install cmake gnu-tar

      # ── Build ──
      - name: Build (zigbuild)
        if: matrix.cross == 'zig' && !matrix.pgo
        shell: bash
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross == 'native' && !matrix.pgo
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      # ── PGO build (issue #55) ─────────────────────────────────────────
      # Two-pass profile-guided build:
      #   Phase 1 — instrumented binary written with `-Cprofile-generate`.
      #   Workload — scripts/pgo-collect.sh runs the binary against an
      #              in-process Go backend for ~30s (3 endpoints × 10s)
      #              with deterministic wrk parameters.
      #   Phase 2 — re-build with `-Cprofile-use` after llvm-profdata merge.
      #
      # Restricted to native x86_64 ubuntu-latest entries: the ubuntu
      # runner can execute the instrumented binary directly. Cross-PGO
      # (musl, aarch64) requires QEMU and is deferred.
      - name: Install PGO tooling (LLVM + Go + wrk)
        if: matrix.pgo
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm wrk
          # Go is preinstalled on ubuntu-latest; sanity-check.
          go version

      - name: PGO Phase 1 — instrumented build
        if: matrix.pgo
        shell: bash
        env:
          PGO_DIR: ${{ runner.temp }}/pgo-data
        run: |
          mkdir -p "$PGO_DIR"
          # `-Cprofile-generate=$PGO_DIR` instruments every function;
          # the runtime writes one .profraw per process / module on
          # exit (LLVM_PROFILE_FILE controls the filename pattern,
          # set in pgo-collect.sh).
          RUSTFLAGS="-Cprofile-generate=${PGO_DIR}" \
            cargo build --release --locked --target ${{ matrix.target }}

      - name: PGO workload — collect profraws
        if: matrix.pgo
        shell: bash
        env:
          ZION_BIN: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          PGO_PROFILE_DIR: ${{ runner.temp }}/pgo-data
        run: bash scripts/pgo-collect.sh

      - name: PGO Phase 2 — merge profiles + optimised build
        if: matrix.pgo
        shell: bash
        env:
          PGO_DIR: ${{ runner.temp }}/pgo-data
        run: |
          # Prefer rustc's bundled llvm-profdata (from the `llvm-tools`
          # component) — its raw-profile format always matches the rustc
          # that produced the .profraw files. Fall back to a system one
          # only if that's somehow missing.
          PROFDATA=$(ls "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-profdata 2>/dev/null | head -1 || true)
          [[ -n "$PROFDATA" ]] || PROFDATA=$(command -v llvm-profdata 2>/dev/null \
            || command -v llvm-profdata-14 2>/dev/null \
            || command -v llvm-profdata-15 2>/dev/null \
            || command -v llvm-profdata-16 2>/dev/null \
            || command -v llvm-profdata-17 2>/dev/null \
            || command -v llvm-profdata-18 2>/dev/null \
            || true)
          if [[ -z "$PROFDATA" ]]; then
            echo "::error::llvm-profdata not found (install the llvm-tools component)"
            exit 1
          fi
          echo "using llvm-profdata: $PROFDATA"
          "$PROFDATA" merge -o "${PGO_DIR}/merged.profdata" "${PGO_DIR}"/*.profraw
          # No `cargo clean` needed: Cargo's fingerprint includes
          # RUSTFLAGS, so swapping `-Cprofile-generate` → `-Cprofile-use`
          # triggers a fresh rebuild of every item the flag touches.
          # `-Cllvm-args=-pgo-warn-missing-function`: surface functions
          # that have no profile data so future workload tweaks can fix
          # gaps before they bite.
          RUSTFLAGS="-Cprofile-use=${PGO_DIR}/merged.profdata -Cllvm-args=-pgo-warn-missing-function" \
            cargo build --release --locked --target ${{ matrix.target }}

      # ── Strip + stage artifact ──
      - name: Stage artifact
        id: stage
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ARTIFACT: ${{ matrix.artifact }}
          MATRIX_PGO: ${{ matrix.pgo }}
          STAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # PGO-built binaries get a `-pgo` archive suffix so the regular
          # and optimised binaries can co-exist in a single release. The
          # SHA256 differs from the non-PGO build by construction (issue
          # #55 acceptance: "PGO build verified to produce a different
          # SHA256 than the non-PGO build").
          if [[ "${MATRIX_PGO}" == "true" ]]; then
            name="zion-${STAGE_VERSION}-${MATRIX_TARGET}-pgo"
          else
            name="zion-${STAGE_VERSION}-${MATRIX_TARGET}"
          fi
          src="target/${MATRIX_TARGET}/release/${MATRIX_ARTIFACT}"

          # Strip on platforms where we have a strip in PATH that targets the
          # right ABI. Skip on Windows (no PE strip) and on macOS cross.
          case "$MATRIX_TARGET" in
            *windows*) ;;
            *apple-darwin) strip "$src" || true ;;
            *) strip "$src" || true ;;
          esac

          # macOS default tar is bsdtar, which doesn't grok the GNU
          # extensions we need for reproducible-archive metadata.
          # Pick the GNU tar installed by `brew install gnu-tar` instead.
          case "$MATRIX_TARGET" in
            *apple-darwin) TAR=gtar ;;
            *) TAR=tar ;;
          esac

          if [[ "$MATRIX_TARGET" == *windows* ]]; then
            archive="${name}.zip"
            7z a "dist/${archive}" "$src" >/dev/null
          else
            archive="${name}.tar.gz"
            "$TAR" --owner=0 --group=0 --numeric-owner \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                --sort=name \
                -czf "dist/${archive}" \
                -C "$(dirname "$src")" "$(basename "$src")"
          fi

          ( cd dist && sha256sum "${archive}" > "${archive}.sha256" )
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      # ── Provenance: bind the cryptographic hash of every archive to the
      # workflow run identity (GitHub OIDC -> Fulcio -> Rekor). SLSA v1.0 L3.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/${{ steps.stage.outputs.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Suffix the artifact key with `-pgo` so the PGO row does not
          # collide with the regular build of the same target (issue #55).
          name: zion-${{ matrix.target }}${{ matrix.pgo && '-pgo' || '' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════
  # 2. Aggregate SHA256SUMS + SBOM, push the GitHub release.
  # ════════════════════════════════════════════════════════════════════════
  publish:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the release + upload assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sbom-release

      - name: Install build deps (for SBOM crate metadata resolution)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential libssl-dev

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        # `cargo-cyclonedx --override-filename FOO --format json` writes
        # `FOO.json` in the manifest dir (no `.cdx.` infix). We rename to
        # the CycloneDX-conventional `<name>.cdx.json` for the release asset.
        run: |
          cargo cyclonedx --all --format json --override-filename zion-sbom
          test -s zion-sbom.json
          mv zion-sbom.json dist/zion-sbom.cdx.json

      - name: Compose top-level SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Collapse the per-archive .sha256 files into one canonical SUMS file,
          # then sign that one too — single source of truth for verifiers.
          rm -f SHA256SUMS
          for f in ./*.sha256; do
            [ -e "$f" ] || continue
            cat "$f" >> SHA256SUMS
          done
          # Re-hash the SBOM and append.
          sha256sum zion-sbom.cdx.json >> SHA256SUMS
          # Drop the per-archive sums file — SHA256SUMS is the canonical source.
          rm -f -- ./*.sha256
          sort -k 2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attest SHA256SUMS + SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/zion-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ════════════════════════════════════════════════════════════════════════
  # 3. Multi-arch container image — keyless-signed + SBOM-attested.
  # ════════════════════════════════════════════════════════════════════════
  container:
    name: container (multi-arch + cosign)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # cosign keyless OIDC
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reproducible-build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Zion Edge Gateway
            org.opencontainers.image.description=High-performance Rust TLS reverse proxy with WAF
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://fabriziosalmi.github.io/zion

      - name: Build & push (linux/amd64,arm64)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      # Guard against the "arm64 manifest carries an amd64 binary" class of
      # bug (a Dockerfile that builds on $BUILDPLATFORM instead of
      # $TARGETPLATFORM stamps one host-arch binary into every manifest). This
      # is invisible to `imagetools inspect` — you have to look at the ELF.
      - name: Verify each arch ships its own binary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          REF="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          fail=0
          for entry in amd64:x86-64 arm64:aarch64; do
            arch="${entry%%:*}"; want="${entry##*:}"
            docker create --platform "linux/${arch}" --name "verify-${arch}" "$REF" >/dev/null
            docker cp "verify-${arch}:/usr/local/bin/zion" "/tmp/zion-${arch}" >/dev/null
            docker rm "verify-${arch}" >/dev/null
            got="$(file -b "/tmp/zion-${arch}")"
            echo "linux/${arch}: ${got}"
            case "$got" in
              *"$want"*) ;;
              *) echo "::error::linux/${arch} image binary is not ${want}"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || { echo "multi-arch image is mislabeled — refusing to sign"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign every tag@digest pair. Each signature is uploaded to Rekor
          # and verifiable via:
          #   cosign verify --certificate-identity-regexp ... ghcr.io/.../zion@sha256:...
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate CycloneDX SBOM (image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          # The image SBOM is bound to the digest via cosign attestation
          # in the next step. Don't double-attach it to the GitHub Release —
          # that would (a) require `contents: write` here (this job is
          # otherwise read-only) and (b) duplicate the binary SBOM that the
          # `publish` job already attaches.
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM to image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

      - name: Attest container provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
