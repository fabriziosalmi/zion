# Release — cross-compiled binaries + signed multi-arch container,
# with SLSA Level 3 provenance and CycloneDX SBOM attestation.
#
# Triggered by:
#   - push of a tag matching v*  (canonical release path)
#   - manual workflow_dispatch   (dry-runs and re-runs)
#
# The pipeline produces, per release tag:
#   1. Statically-linked binaries for 7 targets:
#        x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl,
#        aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl,
#        x86_64-apple-darwin, aarch64-apple-darwin,
#        x86_64-pc-windows-msvc
#   2. SHA256SUMS file (GNU coreutils format) over every artifact.
#   3. CycloneDX SBOM (zion-sbom.cdx.json) covering the dependency closure.
#   4. SLSA v1.0 build provenance (in-toto attestation) for every binary
#      via `actions/attest-build-provenance` (GitHub-hosted Sigstore + Rekor).
#   5. Multi-arch (amd64 + arm64) OCI image pushed to GHCR, keyless-signed
#      with cosign (Fulcio cert + Rekor inclusion proof) plus SBOM
#      attestation bound to the image digest.
#
# Verification steps for downstream users live in docs/security/supply-chain.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release (tag or sha). Required for dry-runs."
        required: true
        default: "master"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # 1. Build cross-compiled binaries.
  #    - linux-gnu/musl x86_64+aarch64 via cargo-zigbuild (handles aws-lc-rs
  #      cross-compilation via Zig's toolchain — no QEMU, no Docker cross).
  #    - macOS x86_64+aarch64 native on the macos runners.
  #    - Windows x86_64 native via MSVC.
  # ════════════════════════════════════════════════════════════════════════
  build:
    name: build (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write          # Sigstore OIDC for attestation step (below)
      attestations: write      # actions/attest-build-provenance writes here
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          # Linux musl (fully static — runs on Alpine, distroless, scratch)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: false
          # macOS — native runners; one Intel, one Apple Silicon.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: native
            artifact: zion
            pgo: false
          - target: aarch64-apple-darwin
            os: macos-15
            cross: native
            artifact: zion
            pgo: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: native
            artifact: zion.exe
            pgo: false
          # ── PGO variant (issue #55) ───────────────────────────────
          # Profile-guided build of the same target: scripts/pgo-build.sh
          # builds an instrumented binary, trains it (scripts/pgo-train.sh),
          # and rebuilds with the profile. Same toolchain as the plain row
          # above (cargo-zigbuild, so the same glibc floor) and the same
          # rustflags (.cargo/config.toml's target-cpu): the profile is the
          # only difference between the two artefacts. Ships next to the
          # plain binary with a `-pgo` suffix, and its profile next to it,
          # so the build can be repeated. Only x86_64-unknown-linux-gnu: the
          # runner must execute the instrumented binary, and a profile made
          # on one architecture does not apply to another.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: zig
            artifact: zion
            pgo: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (tag or dispatch ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # We don't need history for the build, but provenance needs the
          # exact tag commit. Default fetch-depth=1 already provides it.

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Prefer the actual tag name; fall back to the dispatch input,
          # finally to a synthetic dev tag so dry-runs always have a version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.ref }}" ]]; then
            v="dev-$(git rev-parse --short HEAD)"
          else
            v="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Building Zion ${v} for ${{ matrix.target }}"

      - name: Reproducible-build epoch
        id: epoch
        shell: bash
        # SOURCE_DATE_EPOCH = commit timestamp. Tools that respect it (the Rust
        # compiler, strip, archivers, OCI image builders) will emit identical
        # output bit-for-bit across rebuilds of the same commit.
        run: |
          ts=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${ts}" >> "$GITHUB_ENV"
          echo "epoch=${ts}" >> "$GITHUB_OUTPUT"

      # Record the commit BEFORE touching the tree: build.rs stamps "-dirty" when
      # `git status` is not clean, and removing rust-toolchain.toml below made every
      # released binary report e.g. "0.9.5 (61bb90a2c200-dirty)". With these set,
      # build.rs uses them and never consults git (as the container build already does).
      - name: Record commit for the version string
        shell: bash
        run: |
          echo "ZION_GIT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "ZION_COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)" >> "$GITHUB_ENV"

      # Release builds are PINNED to the same toolchain as dev/CI
      # (rust-toolchain.toml, currently 1.88.0) so the shipped binary is
      # REPRODUCIBLE — "latest stable" would silently change the release
      # compiler between tags and defeat the SLSA/attestation guarantee. We
      # still drop rust-toolchain.toml for this job because, when present, it
      # makes `rustup` ignore the target we add below; the explicit `toolchain:`
      # input pins the exact version instead. To move the release compiler,
      # bump BOTH this pin and rust-toolchain.toml together.
      - name: Drop dev toolchain pin for release builds
        shell: bash
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0
          # `llvm-tools` ships rustc's *own* `llvm-profdata`, whose raw
          # profile format always matches the compiler that wrote the
          # `.profraw` files. A system llvm-profdata can be older (profraw
          # version mismatch → "no profile can be merged"). Needed by the
          # PGO merge step; harmless on the non-PGO legs.
          components: llvm-tools

      - name: Install matrix target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # ring 0.17 sanity-checks static target_features at compile time and
      # fails on `target-cpu=native` runners where the host's feature set
      # disagrees with ring's MIN_STATIC_FEATURES baseline. The repo's
      # .cargo/config.toml sets `target-cpu=native` for Apple Silicon for
      # local dev speed; for redistributable release binaries we override
      # with the M1 baseline (always present on every Apple Silicon shipped
      # since 2020) so the resulting binary runs on every M-series chip.
      - name: Pin RUSTFLAGS for redistributable Apple Silicon binary
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: echo "RUSTFLAGS=-C target-cpu=apple-m1" >> "$GITHUB_ENV"
      # Intel macOS: the compiler's own default for this target (SSE4.1; every Intel Mac
      # since 2008), said explicitly because .cargo/config.toml says `native` for the Mac
      # triples. It was x86-64-v3 until v0.12.0, which a Mac without AVX2 (before 2013)
      # cannot run; see #662 for what that flag bought. The "CPU baseline" step below fails
      # if this is ever more than the target's default.
      - name: Pin RUSTFLAGS for redistributable Intel macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "RUSTFLAGS=-C target-cpu=penryn" >> "$GITHUB_ENV"

      # ── Cross-compile path: zigbuild handles musl + aarch64 + aws-lc-rs ──
      - name: Setup zigbuild
        if: matrix.cross == 'zig'
        # NOTE: v2.2.1 is still a Node 20 action (mlugg/setup-zig has no Node 24
        # release yet), so GitHub's Node-20 deprecation warning persists for this
        # step until upstream migrates — it runs forced-on-node24 meanwhile.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.cross == 'zig'
        # Pinned: the version that built v0.9.15 (an unpinned install changed the release
        # toolchain whenever upstream published). reproducibility.yml pins the same one.
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      # ── Native build deps ──
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        # `gnu-tar` provides `gtar`, used by the Stage step below — the
        # macOS default `/usr/bin/tar` is bsdtar which doesn't accept
        # `--mtime=@<epoch>` (GNU syntax) or `--sort=name`.
        run: brew install cmake gnu-tar

      # ── Paths out of the binary (#669) ──
      # A binary carries the source paths of its dependencies, and they were this runner's:
      # cargo's home, and with the rust-src component the toolchain's own directory. Remapped
      # to fixed names, the bytes are the same wherever the build runs
      # (scripts/remap-rustflags.sh). And an empty zig cache: zig reuses a compiled C object
      # whatever SOURCE_DATE_EPOCH is, and the allocator's has its compile time in it.
      - name: Keep this runner's paths out of the binary
        if: matrix.cross == 'zig'
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          var="CARGO_TARGET_$(tr 'a-z.-' 'A-Z__' <<<"$MATRIX_TARGET")_RUSTFLAGS"
          echo "${var}=$(bash scripts/remap-rustflags.sh)" | tee -a "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=${RUNNER_TEMP}/zig-cache" | tee -a "$GITHUB_ENV"

      # ── Build ──
      # --features dist (acme + init): the redistributable bundle so the
      # release artifacts ship automatic HTTPS and the init wizard.
      - name: Build (zigbuild)
        if: matrix.cross == 'zig' && !matrix.pgo
        shell: bash
        run: |
          cargo zigbuild --release --locked --features dist --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross == 'native' && !matrix.pgo
        shell: bash
        run: |
          cargo build --release --locked --features dist --target ${{ matrix.target }}

      # ── PGO build (issue #55) ─────────────────────────────────────────
      # scripts/pgo-build.sh does all of it and fails closed: the training
      # must complete every phase, the profile must cover the code, the
      # binary must be compiled with the profile AND with the target-cpu of
      # the plain build, must need no newer glibc than the plain build, and
      # must get through the training workload itself. The test suite
      # compiled with the profile runs in pgo.yml, on pull requests, not
      # here: a tag is not the place to meet a test that fails now and then
      # (#657). Both builds are zigbuild (one cargo configuration, or the
      # profile's function names would not match); only the instrumented
      # LINK goes to the system cc, because zig's driver does not take the
      # flag an instrumented link needs.
      # h2load (nghttp2-client) drives the training; Go builds its backend.
      - name: Install PGO tooling (h2load, Go)
        if: matrix.pgo
        run: |
          sudo apt-get update
          sudo apt-get install -y nghttp2-client
          go version

      # The training sends megabytes a second over the loopback interface, whose MTU is
      # 65536. On these runners (ubuntu-24.04, kernel 6.17 azure) a receiving socket's buffer
      # now and then ends up smaller than one such segment: the segments are dropped, the
      # sender retransmits on its timer, and one connection crawls for minutes. Measured on
      # the phase "files over HTTP/2": late in 10 runs of 58 with zion and in 19 of 166 with
      # nginx serving the same files (so it is not the server), in none of 250 with the
      # loopback at a network's MTU. The profile is the same either way (99.8 % overlap).
      - name: Loopback at a network's MTU for the training
        if: matrix.pgo
        run: |
          sudo ip link set dev lo mtu 1500
          ip link show lo | head -1

      - name: PGO build (instrumented build, training, optimised build, checks)
        if: matrix.pgo
        shell: bash
        env:
          PGO_TARGET: ${{ matrix.target }}
          PGO_CARGO: cargo zigbuild
          PGO_GENERATE_LINKER: cc
          PGO_CARGO_TEST: cargo-zigbuild test
          PGO_MAX_GLIBC: "2.28"
        run: PGO_OUT="${RUNNER_TEMP}/pgo" bash scripts/pgo-build.sh

      # ── CPU baseline (#662, #666) ──
      # A binary compiled for a newer processor than its target's baseline stops with an
      # illegal instruction on an older one. Before anything is staged or attested:
      # every binary must say it was built with the compiler's defaults for its target, and
      # the Linux ones must serve under an emulated processor that has the architecture's
      # baseline and nothing later: SSE2 for x86_64, a Cortex-A53 for aarch64
      # (scripts/cpu-baseline-smoke.sh). macOS and Windows binaries cannot be run on an
      # emulated old processor here, so for them it is the declaration only.
      - name: CPU baseline (declared; executed under an emulated baseline CPU on Linux)
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ARTIFACT: ${{ matrix.artifact }}
        run: |
          case "$MATRIX_TARGET" in
            x86_64-unknown-linux-*)
              sudo apt-get install -y qemu-user >/dev/null
              export SMOKE_MODE=emulate
              ;;
            aarch64-unknown-linux-*)
              # The libraries a dynamically linked aarch64 binary needs on this x86_64 runner.
              sudo apt-get install -y qemu-user libc6-arm64-cross >/dev/null
              export SMOKE_MODE=emulate
              ;;
            *)
              export SMOKE_MODE=declare
              ;;
          esac
          bash scripts/cpu-baseline-smoke.sh "target/${MATRIX_TARGET}/release/${MATRIX_ARTIFACT}"

      # ── Strip + stage artifact ──
      - name: Stage artifact
        id: stage
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_ARTIFACT: ${{ matrix.artifact }}
          MATRIX_PGO: ${{ matrix.pgo }}
          STAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # PGO-built binaries get a `-pgo` archive suffix so the regular
          # and optimised binaries can co-exist in a single release. The
          # SHA256 differs from the non-PGO build by construction (issue
          # #55 acceptance: "PGO build verified to produce a different
          # SHA256 than the non-PGO build").
          if [[ "${MATRIX_PGO}" == "true" ]]; then
            name="zion-${STAGE_VERSION}-${MATRIX_TARGET}-pgo"
          else
            name="zion-${STAGE_VERSION}-${MATRIX_TARGET}"
          fi
          src="target/${MATRIX_TARGET}/release/${MATRIX_ARTIFACT}"

          # Strip on platforms where we have a strip in PATH that targets the
          # right ABI. Skip on Windows (no PE strip) and on macOS cross.
          case "$MATRIX_TARGET" in
            *windows*) ;;
            *apple-darwin) strip "$src" || true ;;
            *) strip "$src" || true ;;
          esac

          # macOS default tar is bsdtar, which doesn't grok the GNU
          # extensions we need for reproducible-archive metadata.
          # Pick the GNU tar installed by `brew install gnu-tar` instead.
          case "$MATRIX_TARGET" in
            *apple-darwin) TAR=gtar ;;
            *) TAR=tar ;;
          esac

          if [[ "$MATRIX_TARGET" == *windows* ]]; then
            archive="${name}.zip"
            7z a "dist/${archive}" "$src" >/dev/null
          else
            archive="${name}.tar.gz"
            "$TAR" --owner=0 --group=0 --numeric-owner \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                --sort=name \
                -czf "dist/${archive}" \
                -C "$(dirname "$src")" "$(basename "$src")"
          fi

          ( cd dist && sha256sum "${archive}" > "${archive}.sha256" )
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

          # The profile the PGO binary was built from: with it, the commit and
          # SOURCE_DATE_EPOCH, scripts/pgo-build.sh rebuilds the same binary.
          if [[ "${MATRIX_PGO}" == "true" ]]; then
            cp "${RUNNER_TEMP}/pgo/zion.profdata" "dist/${name}.profdata"
            ( cd dist && sha256sum "${name}.profdata" > "${name}.profdata.sha256" )
            echo "profile=${name}.profdata" >> "$GITHUB_OUTPUT"
          fi

      # ── Provenance: bind the cryptographic hash of every archive to the
      # workflow run identity (GitHub OIDC -> Fulcio -> Rekor). SLSA v1.0 L3.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/${{ steps.stage.outputs.archive }}"

      - name: Generate SLSA build provenance (PGO profile)
        if: matrix.pgo
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/${{ steps.stage.outputs.profile }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Suffix the artifact key with `-pgo` so the PGO row does not
          # collide with the regular build of the same target (issue #55).
          name: zion-${{ matrix.target }}${{ matrix.pgo && '-pgo' || '' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════
  # 2. Aggregate SHA256SUMS + SBOM, push the GitHub release.
  # ════════════════════════════════════════════════════════════════════════
  publish:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the release + upload assets
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Pinned to match rust-toolchain.toml (1.88.0) — this job resolves crate
      # metadata for the SBOM, so keep it on the same toolchain as the build.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: sbom-release

      - name: Install build deps (for SBOM crate metadata resolution)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential libssl-dev

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.9

      - name: Generate CycloneDX SBOM
        # `cargo-cyclonedx --override-filename FOO --format json` writes
        # `FOO.json` in the manifest dir (no `.cdx.` infix). We rename to
        # the CycloneDX-conventional `<name>.cdx.json` for the release asset.
        run: |
          cargo cyclonedx --all --format json --override-filename zion-sbom
          test -s zion-sbom.json
          mv zion-sbom.json dist/zion-sbom.cdx.json

      - name: Compose top-level SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Collapse the per-archive .sha256 files into one canonical SUMS file,
          # then sign that one too — single source of truth for verifiers.
          rm -f SHA256SUMS
          for f in ./*.sha256; do
            [ -e "$f" ] || continue
            cat "$f" >> SHA256SUMS
          done
          # Re-hash the SBOM and append.
          sha256sum zion-sbom.cdx.json >> SHA256SUMS
          # Drop the per-archive sums file — SHA256SUMS is the canonical source.
          rm -f -- ./*.sha256
          sort -k 2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attest SHA256SUMS + SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/zion-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ════════════════════════════════════════════════════════════════════════
  # 3. Multi-arch container image — keyless-signed + SBOM-attested.
  # ════════════════════════════════════════════════════════════════════════
  # Build each architecture on its OWN native runner (amd64 on ubuntu-latest,
  # arm64 on the free ubuntu-24.04-arm hosted runner) — no QEMU emulation, so
  # the arm64 leg drops from ~40 min to a few. Each leg pushes by digest; the
  # `container` job below fuses the two digests into one multi-arch manifest.
  container-build:
    name: container build (${{ matrix.arch }})
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            want: x86-64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            want: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push by digest to GHCR
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reproducible-build epoch + git stamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          # Passed as Docker build-args so build.rs stamps the real commit into
          # the container binary (the build context has no .git). Same short-12
          # sha + commit-date format build.rs computes locally.
          echo "ZION_GIT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "ZION_COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's `created` is the COMMIT's time, not the clock's: metadata-action
      # defaults it to "now", which alone makes two builds of one commit differ. The same
      # value is used for the per-arch images and the manifest list (reproducibility, #538).
      - name: Image creation time (the commit's)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "IMAGE_CREATED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.committer.date)" >> "$GITHUB_ENV"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Zion Edge Gateway
            org.opencontainers.image.description=High-performance Rust TLS reverse proxy with WAF
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://fabriziosalmi.github.io/zion
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}

      # Build the single native platform and push it by DIGEST (no tag). A clean
      # single-platform manifest (provenance/sbom off) keeps the digest simple so
      # `imagetools create` can fuse the two arches; SLSA provenance + SBOM are
      # attested to the final manifest in the `container` job.
      - name: Build & push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            ZION_GIT_SHA=${{ env.ZION_GIT_SHA }}
            ZION_COMMIT_DATE=${{ env.ZION_COMMIT_DATE }}
          # rewrite-timestamp: layer file times are clamped to SOURCE_DATE_EPOCH, so the
          # state directory and COPY'd files do not carry this checkout's times (#538).
          # Two builds of one commit then give one image digest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      # Guard against the "arm64 manifest carries an amd64 binary" class of bug.
      # Done on the NATIVE runner, so the extracted ELF is this arch with no QEMU
      # and no manifest-list digest juggling — just build, extract, `file`.
      - name: Verify this arch ships its own binary
        run: |
          REF="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker create --name verify "$REF" >/dev/null
          docker cp verify:/usr/local/bin/zion /tmp/zion >/dev/null
          docker rm verify >/dev/null
          got="$(file -b /tmp/zion)"
          echo "${{ matrix.platform }}: ${got}"
          case "$got" in
            *"${{ matrix.want }}"*) ;;
            *) echo "::error::${{ matrix.platform }} image binary is not ${{ matrix.want }}"; exit 1 ;;
          esac

      # The same question as for the tarballs (#662): does the binary in the image run on a
      # processor with the architecture's baseline and nothing later? A failure here stops
      # the manifest: no tag ever points at this digest.
      - name: The image's binary serves under an emulated baseline CPU
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y qemu-user >/dev/null
          # rust-toolchain.toml is in this checkout: `rustc` is the compiler the image was
          # built with, and the script asks it for the target's default features.
          rustup toolchain install >/dev/null 2>&1 || true
          rustc --version
          bash scripts/cpu-baseline-smoke.sh /tmp/zion

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # Fuse the per-arch digests into one multi-arch manifest, then verify, sign
  # (cosign keyless), and attest SBOM + SLSA provenance to the manifest digest.
  container:
    name: container (multi-arch manifest + cosign)
    needs: [container-build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the manifest to GHCR
      id-token: write # cosign keyless OIDC
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: container-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's `created` is the COMMIT's time, not the clock's: metadata-action
      # defaults it to "now", which alone makes two builds of one commit differ. The same
      # value is used for the per-arch images and the manifest list (reproducibility, #538).
      - name: Image creation time (the commit's)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "IMAGE_CREATED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.committer.date)" >> "$GITHUB_ENV"

      - name: Image metadata (tags + labels)
        id: meta
        # Emit index-LEVEL annotations so the fused manifest list carries the
        # OCI title/description/source that GHCR reads to link the package to
        # this repo (a plain `imagetools create` would otherwise drop them).
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Zion Edge Gateway
            org.opencontainers.image.description=High-performance Rust TLS reverse proxy with WAF
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://fabriziosalmi.github.io/zion
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
          annotations: |
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}

      - name: Create & push multi-arch manifest
        id: manifest
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          # Build the arg list as an array so tag/annotation values that contain
          # spaces (the description) survive without word-splitting.
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$META_JSON")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done < <(jq -r '.annotations[]?' <<< "$META_JSON")
          for f in /tmp/digests/*; do args+=("${REGISTRY}/${IMAGE_NAME}@$(cat "$f")"); done
          printf 'imagetools create %s\n' "${args[*]}"
          docker buildx imagetools create "${args[@]}"
          first_tag="$(jq -r '.tags[0]' <<< "$META_JSON")"
          manifest_digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${IMAGE_NAME}@${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Verify the manifest lists both arches
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect '${{ steps.manifest.outputs.ref }}' \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "manifest platforms: ${platforms}"
          echo "${platforms}" | grep -q 'linux/amd64' || { echo '::error::manifest missing linux/amd64'; exit 1; }
          echo "${platforms}" | grep -q 'linux/arm64' || { echo '::error::manifest missing linux/arm64'; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate CycloneDX SBOM (image)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.manifest.outputs.ref }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM to image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: image-sbom.cdx.json
          push-to-registry: true

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
