# Stability soak — prove RSS + open FDs stay flat under stress (no leak).
# The RSS/FD gauges are read from /proc, so this is Linux-only (they are 0 on
# macOS/Windows; the harness hard-fails if it sees 0).
#
# Two jobs, one harness:
#   * gate    — fast, on PRs/pushes touching the leak-prone paths; catches
#               gross regressions (a per-request fd leak or RSS doubling).
#   * nightly — long soak on a cron; the authoritative slope + fd verdict, with
#               the samples uploaded as an artifact (feeds the dashboard's
#               deriv(RSS[30m]) leak-watch). GitHub-hosted jobs can run up to
#               6h, so the ~2h soak fits ubuntu-latest — no self-hosted runner.
name: stability-soak

on:
  pull_request:
    paths:
      - "src/proxy.rs"
      - "src/dispatch.rs"
      - "src/reload.rs"
      - "src/cache.rs"
      - "src/tls.rs"
      - "src/waf.rs"
      - "src/security.rs"
      - "src/connlimit.rs"
      - "src/main.rs"
      - "tests/stability-soak/**"
      - ".github/workflows/stability-soak.yml"
  push:
    branches: [master]
    paths:
      - "src/proxy.rs"
      - "src/dispatch.rs"
      - "src/reload.rs"
      - "src/cache.rs"
      - "src/tls.rs"
      - "src/waf.rs"
      - "src/security.rs"
      - "src/connlimit.rs"
      - "src/main.rs"
      - "tests/stability-soak/**"
      - ".github/workflows/stability-soak.yml"
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC — the long soak
  workflow_dispatch:
    inputs:
      duration:
        description: "soak duration in seconds (overrides the default)"
        required: false

permissions:
  contents: read

concurrency:
  group: stability-soak-${{ github.workflow }}-${{ github.ref }}
  # Never cancel the scheduled master soak; do cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gate on PRs/pushes: short soak, catches gross leaks only.
  gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: integration
      - name: Build zion (release)
        run: cargo build --release --locked --bin zion
      - name: Build bench backend (release)
        run: cargo build --release --manifest-path benchmarks/backend/Cargo.toml
      - name: Soak (fast gate — gross-leak catch)
        env:
          NO_COLOR: "1"
          # Longer than a pure smoke so the mimalloc working-set + cache-fill
          # ramp has room to plateau before the tail window.
          DURATION: "180"
          WARMUP: "45"
          WORKERS: "20"
          RELOADS: "40"
          # GROSS-leak budget. At ~3 min the mimalloc segment cache (warmed by
          # the reload churn) is still settling — its residual tail slope runs
          # ~30 KB/s and varies run-to-run, which is NOT a leak. So the fast
          # gate only catches gross regressions (a per-request/-reload leak or
          # RSS doubling ≈ 400+ KB/s over the run); the FD bound stays tight for
          # socket leaks. The nightly (2h, 600 B/s budget, 10 min warmup) is the
          # authoritative moderate-slope verdict once the working set is settled.
          RSS_BUDGET_BPS: "150000"
        run: ./tests/stability-soak/run.sh

  # Nightly long soak: the authoritative RSS-slope + fd verdict.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: integration
      - name: Build zion (release)
        run: cargo build --release --locked --bin zion
      - name: Build bench backend (release)
        run: cargo build --release --manifest-path benchmarks/backend/Cargo.toml
      - name: Soak (nightly — ~2h authoritative)
        env:
          NO_COLOR: "1"
          DURATION: ${{ github.event.inputs.duration || '7200' }}
          WARMUP: "600"
          INTERVAL: "10"
          WORKERS: "32"
          RELOADS: "1200"
          CARDINALITY: "50000"
        run: ./tests/stability-soak/run.sh
      - name: Upload soak samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-samples
          path: soak-samples.tsv
          retention-days: 14
