name: Sovereign Data Refresh

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Manual trigger for immediate refresh
    inputs:
      dry_run:
        description: "Fetch, verify and generate, but push no branch and open no PR"
        type: boolean
        default: false

# Top-level: read-only by default. Write scopes are granted per-job
# below (only the refresh job actually needs them, and only to push a
# branch + open a PR). Any future job starts read-only and has to opt in.
permissions:
  contents: read

jobs:
  # The three source files are downloaded once and handed to both regions, so
  # the Italian and the EU table are cut from the same snapshot. (They used to be
  # fetched by each leg on its own, minutes apart, and could differ.)
  fetch:
    name: fetch sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Offline generator tests (no network)
      # The holder matcher, the input checks and the change budget, against
      # fixtures: a regression in any of them stops the refresh before it starts.
      run: python3 scripts/test_generate_sovereign_data.py

    - name: Download RIPE NCC delegated stats + IPtoASN
      # curl --fail with retries and timeouts, RIPE's published MD5, gzip's own
      # check on each archive. Writes SOURCES.tsv next to the files.
      run: scripts/fetch_sovereign_sources.sh "$RUNNER_TEMP/sovereign-sources"

    - name: Verify the sources
      # Fail here, once, rather than in both legs: RIPE's record counts and date,
      # IPtoASN covering the address space end to end with no hole.
      run: |
        src="$RUNNER_TEMP/sovereign-sources"
        python3 scripts/generate_sovereign_data.py --verify-only \
          --ripe "$src/delegated-ripencc-latest" \
          --ripe-md5 "$src/delegated-ripencc-latest.md5" \
          --iptoasn "$src/ip2asn-v4.tsv" \
          --iptoasn6 "$src/ip2asn-v6.tsv" \
          --manifest "$src/SOURCES.tsv"

    # Kept for 30 days: when a refresh looks wrong, the files it was built from
    # are still there to rebuild it from.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sovereign-sources
        path: ${{ runner.temp }}/sovereign-sources
        retention-days: 30
        if-no-files-found: error

  # One leg per baked-in dataset. `ita` is ASN-role only; `eu` is the
  # hybrid country-baseline + curated-ASN-role model. Both regenerate
  # from the same downloaded sources and open their own refresh PR.
  refresh:
    name: refresh ${{ matrix.region }}
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      # Read-only on purpose. Both writes this job performs — pushing the branch
      # and opening the PR — are carried by SOVEREIGN_DATA_PAT, so GITHUB_TOKEN
      # needs nothing beyond read. Leaving `contents: write` here would grant a
      # capability nothing uses, against this file's own stated posture.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: ita
            output: src/sovereign/data_ita.rs
            adjective: Italian
          - region: eu
            output: src/sovereign/data_eu.rs
            adjective: EU-27
    steps:
    # Fail with a sentence a human can act on. Without this, a missing secret
    # surfaces 40 lines later as an opaque auth error on `git push`, which is
    # how the previous three failures in this workflow stayed unread.
    - name: Preflight — the refresh PAT must be present
      env:
        PAT: ${{ secrets.SOVEREIGN_DATA_PAT }}
      run: |
        if [ -z "$PAT" ]; then
          echo "::error::secret SOVEREIGN_DATA_PAT is not set."
          echo "This workflow opens its refresh PR with a dedicated fine-grained PAT"
          echo "rather than GITHUB_TOKEN, because 'Allow GitHub Actions to create and"
          echo "approve pull requests' is disabled repo-wide — deliberately, since"
          echo "enabling it would grant that power to every workflow here."
          echo ""
          echo "Create a fine-grained PAT scoped to this repository only, with:"
          echo "  Contents:      Read and write   (push the refresh branch)"
          echo "  Pull requests: Read and write   (open the refresh PR)"
          echo "Nothing else. Then add it as the SOVEREIGN_DATA_PAT repository secret."
          exit 1
        fi

    # checkout stores whichever token it is given, and `git push` later reuses
    # that stored credential. Passing the PAT here is therefore what makes the
    # push work — the default GITHUB_TOKEN is read-only in this job.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.SOVEREIGN_DATA_PAT }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sovereign-sources
        path: ${{ runner.temp }}/sovereign-sources

    - name: Validate curated ASN holders + generate ${{ matrix.output }}
      id: generate
      run: |
        # The generator checks the three files again (they crossed a job
        # boundary: SOURCES.tsv pins their size and SHA-256), validates every
        # curated ASN against its LIVE RIPEstat holder, builds the table and
        # measures it against the one on master. It stops, and no PR opens, when:
        #   exit 4  a source file fails its integrity checks;
        #   exit 2  a curated ASN changed holder (RIPE reassigns ASNs: the old
        #           pipeline chased the number and re-labelled the new holder's
        #           ranges with the old Italian/EU role);
        #   exit 3  the new table moves a class by more than a fifth.
        # Each of these is INTENTIONAL and needs a human.
        src="$RUNNER_TEMP/sovereign-sources"
        code=0
        python3 scripts/generate_sovereign_data.py \
          --region ${{ matrix.region }} \
          --ripe "$src/delegated-ripencc-latest" \
          --ripe-md5 "$src/delegated-ripencc-latest.md5" \
          --iptoasn "$src/ip2asn-v4.tsv" \
          --iptoasn6 "$src/ip2asn-v6.tsv" \
          --manifest "$src/SOURCES.tsv" \
          --report "$RUNNER_TEMP/report.json" \
          --summary "$RUNNER_TEMP/summary.md" \
          --output ${{ matrix.output }} || code=$?
        if [ -f "$RUNNER_TEMP/summary.md" ]; then
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        case "$code" in
          0) ;;
          2) echo "::error title=Sovereign holder drift::A curated ${{ matrix.region }} ASN no longer matches its live RIPEstat holder (see the drift report in the log). The dataset will NOT refresh until scripts/generate_sovereign_data.py is corrected by hand. This is fail-closed on purpose — a reassigned ASN must never be re-labelled with a sovereign role automatically."
             exit 1 ;;
          3) echo "::error title=Sovereign refresh over budget::The new ${{ matrix.region }} table moves a class by more than a fifth (see the job summary). That is a broken input or an edit of the curated ASN list, not a week of routing changes. No PR was opened. If the list was edited, regenerate by hand with --allow-over-budget and review the result."
             exit 1 ;;
          4) echo "::error title=Sovereign source refused::A downloaded source file failed its integrity checks (see INPUT REFUSED in the log): truncated, replaced, changed after the download, or stale. No table was generated from it."
             exit 1 ;;
          *) echo "::error title=Sovereign generator failed::scripts/generate_sovereign_data.py exited with $code (see the log)."
             exit 1 ;;
        esac
        review="$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["needs_review"]).lower())' "$RUNNER_TEMP/report.json")"
        echo "needs_review=$review" >> "$GITHUB_OUTPUT"

    - name: Check for changes
      id: diff
      run: |
        if git diff --quiet ${{ matrix.output }}; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          LINES_ADDED=$(git diff --stat ${{ matrix.output }} | tail -1 | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "0")
          LINES_REMOVED=$(git diff --stat ${{ matrix.output }} | tail -1 | grep -oP '\d+ deletion' | grep -oP '\d+' || echo "0")
          {
            echo "changed=true"
            echo "added=$LINES_ADDED"
            echo "removed=$LINES_REMOVED"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Create PR
      # `inputs` is empty on the schedule, so the weekly run always gets here.
      if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
      run: |
        BRANCH="sovereign-data-${{ matrix.region }}-$(date +%Y%m%d)"

        # The runner has no git identity, so `git commit` aborted with
        #   fatal: empty ident name (for <runner@...>) not allowed
        # every scheduled run since 2026-07-06 — the fetch worked, the commit
        # never happened, and the datasets silently stopped being refreshed.
        # `-s` below derives the Signed-off-by trailer from these values, so the
        # identity and the DCO sign-off cannot drift apart.
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -b "$BRANCH"
        git add ${{ matrix.output }}
        # -s is required: dco.yml gates every pull_request to master on a
        # Signed-off-by trailer, so an unsigned commit here would open a PR that
        # can never merge.
        git commit -s -m "data(sovereign): weekly ${{ matrix.adjective }} CIDR refresh

        Source: RIPE NCC delegated + IPtoASN ($(date +%Y-%m-%d))
        Changes: +${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} lines"

        git push origin "$BRANCH"

        # The body is what the generator measured: the sources and their dates,
        # what needs a look, addresses per class before and after.
        {
          echo "Automated weekly refresh of the ${{ matrix.adjective }} table."
          echo
          cat "$RUNNER_TEMP/summary.md"
          echo
          echo "### Checked before this PR opened"
          echo
          echo "- The three source files: RIPE's record counts, date and published MD5; IPtoASN covering the address space with no hole; none older than a week."
          echo "- Every curated ASN still matches its live RIPEstat holder (the job stops otherwise, so a reassigned ASN is not re-labelled with a sovereign role)."
          echo "- No class moves by more than a fifth (the job stops otherwise)."
          echo
          echo "CI additionally runs \`ranges_are_sorted\`, \`ranges_dont_overlap\` and the pinned golden classification test."
        } > "$RUNNER_TEMP/body.md"

        # A refresh that moves a class by more than 2 %, or a /18 (IPv6: a /32)
        # in or out of a role class, opens as a DRAFT: marking it ready is the
        # act of having looked at the list at the top of the body.
        if [ "${{ steps.generate.outputs.needs_review }}" = "true" ]; then
          gh pr create --draft \
            --title "data(sovereign): weekly ${{ matrix.adjective }} CIDR refresh ($(date +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label "sovereign-data,automated,sovereign-review"
        else
          gh pr create \
            --title "data(sovereign): weekly ${{ matrix.adjective }} CIDR refresh ($(date +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label "sovereign-data,automated"
        fi
      env:
        # Dedicated PAT, not GITHUB_TOKEN: repo-wide policy blocks Actions from
        # creating pull requests, and the narrow fix is a token scoped to this
        # repo rather than lifting that policy for every workflow.
        GH_TOKEN: ${{ secrets.SOVEREIGN_DATA_PAT }}
