name: Sovereign Data Refresh

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Manual trigger for immediate refresh

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-ita:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download RIPE NCC RIS dump (IT country)
      run: |
        mkdir -p .sovereign-data
        # Download latest RIPE NCC delegated stats (authoritative source for IP allocation)
        curl -sL https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest \
          -o .sovereign-data/delegated-ripencc-latest
        # Download IPtoASN bulk data (Team Cymru, free)
        curl -sL https://iptoasn.com/data/ip2asn-v4.tsv.gz \
          -o .sovereign-data/ip2asn-v4.tsv.gz
        gunzip -f .sovereign-data/ip2asn-v4.tsv.gz

    - name: Generate data_ita.rs
      run: |
        python3 scripts/generate_sovereign_data.py \
          --country IT \
          --ripe .sovereign-data/delegated-ripencc-latest \
          --iptoasn .sovereign-data/ip2asn-v4.tsv \
          --output src/sovereign/data_ita.rs \
          --module-name data_ita

    - name: Check for changes
      id: diff
      run: |
        if git diff --quiet src/sovereign/data_ita.rs; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          LINES_ADDED=$(git diff --stat src/sovereign/data_ita.rs | tail -1 | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "0")
          LINES_REMOVED=$(git diff --stat src/sovereign/data_ita.rs | tail -1 | grep -oP '\d+ deletion' | grep -oP '\d+' || echo "0")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "added=$LINES_ADDED" >> "$GITHUB_OUTPUT"
          echo "removed=$LINES_REMOVED" >> "$GITHUB_OUTPUT"
        fi

    - name: Create PR
      if: steps.diff.outputs.changed == 'true'
      run: |
        BRANCH="sovereign-data-$(date +%Y%m%d)"
        git checkout -b "$BRANCH"
        git add src/sovereign/data_ita.rs
        git commit -m "data(sovereign): weekly Italian CIDR refresh

        Source: RIPE NCC delegated + IPtoASN ($(date +%Y-%m-%d))
        Changes: +${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} lines"

        git push origin "$BRANCH"
        gh pr create \
          --title "data(sovereign): weekly Italian CIDR refresh ($(date +%Y-%m-%d))" \
          --body "Automated weekly refresh of Italian ASN/CIDR ranges from authoritative sources.

        **Sources:**
        - RIPE NCC delegated stats: \`ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest\`
        - IPtoASN (Team Cymru): \`iptoasn.com/data/ip2asn-v4.tsv.gz\`

        **Verification:** Review the diff to ensure no unexpected ranges were added/removed.
        The \`ranges_are_sorted\` and \`ranges_dont_overlap\` tests will run in CI." \
          --label "sovereign-data,automated"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
