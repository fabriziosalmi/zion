# Equivalence harness: prove `zion import <nginx|caddy|traefik>` routes like the
# proxy it converted, on real instances (real nginx / caddy / traefik vs real
# zion serving the imported config). Runs the branch binary (ZION_BIN mode), so
# a mapper regression in any of the three front-ends is caught before merge.
name: equivalence

on:
  push:
    branches: [master]
    paths:
      - "src/import/**"
      - "src/config.rs"
      - "tests/equivalence/**"
      - ".github/workflows/equivalence.yml"
  # No `paths` here: this is a required check, and a required check that never starts blocks
  # the merge. The `scope` job below decides whether the real job runs (scripts/pr-touches.sh).
  pull_request:
  workflow_dispatch:

concurrency:
  group: equivalence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: equivalence scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "run=$(scripts/pr-touches.sh 'src/import' 'src/config.rs' 'tests/equivalence' '.github/workflows/equivalence.yml' 'scripts/pr-touches.sh')" >> "$GITHUB_OUTPUT"

  equivalence:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships a recent stable Rust; the importer is default-
      # features and MSRV-1.82, so the runner toolchain is fine (same choice
      # as acme-soak.yml — one less action on the critical path).
      - name: Build zion (default features)
        run: |
          rustc --version && cargo --version
          cargo build --release --locked --bin zion

      - name: Equivalence — nginx (multi-vhost)
        env:
          ZION_BIN: target/release/zion
          NO_COLOR: "1"
        run: ./tests/equivalence/run.sh multi-vhost

      - name: Equivalence — caddy (caddy-basic)
        env:
          ZION_BIN: target/release/zion
          NO_COLOR: "1"
        run: ./tests/equivalence/run.sh caddy-basic

      - name: Equivalence — traefik (traefik-compose, real traefik via docker compose)
        env:
          ZION_BIN: target/release/zion
          NO_COLOR: "1"
        run: ./tests/equivalence/run.sh traefik-compose
