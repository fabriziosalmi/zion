# Supply-chain — vulnerability, license, provenance, and unsafe-surface audit.
#
# Runs:
#   - on every PR (advisory + license + bans)
#   - daily at 06:00 UTC (catches NEW advisories on already-merged code —
#     yesterday's clean lock-file is today's CVE)
#   - on every release tag (full rebuild + SBOM upload to the release)
#
# Each job is independent and surfaces its own status check, so a license
# regression and a new CVE produce *separate* signals — not one giant red.

name: supply-chain

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily — catch newly-published advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  # The repo's `rust-toolchain.toml` pins `channel = "1.88.0"` with
  # `profile = "minimal"`. Some self-hosted runners have that 1.88.0
  # toolchain installed *without* the `cargo` component, so the in-repo
  # override makes `cargo install`/`cargo vet` fail with "the 'cargo'
  # binary … is not applicable to the '1.88.0' toolchain". These audit
  # tools don't need the pinned compiler — they analyse Cargo.lock and the
  # vet baseline — so we force `stable` (installed by dtolnay/rust-toolchain
  # below) and bypass the override. RUSTUP_TOOLCHAIN has the highest
  # precedence, above rust-toolchain.toml. GitHub-hosted CI is unaffected
  # because a fresh runner auto-syncs a complete 1.88.0.
  RUSTUP_TOOLCHAIN: stable

jobs:
  # ── 1. RustSec advisories — scheduled + on-PR. ────────────────────────────
  audit:
    name: cargo-audit (advisories)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Prebuilt binary, not `cargo install` from source: building the tool
      # on the self-hosted runners is the flaky step ("could not parse/
      # generate dep info … .d: No such file" — a /tmp race during the
      # install build). A downloaded binary sidesteps it and is faster.
      - name: Install cargo-audit
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        # Fail on any unfixed advisory + any yanked crate.
        run: cargo audit --deny warnings --deny unmaintained --deny unsound --deny yanked

  # ── 2. cargo-deny: advisories+licenses+bans+sources, all in one. ──────────
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The cargo-deny action does the install + cache for us, with the
      # check name driving deny.toml's section filter.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features

  # ── 3. cargo-vet — supply-chain trust audit (REQUIRED). ──────────────────
  # The baseline lives under `supply-chain/`. The job runs in `--locked`
  # mode so a fresh `imports.lock` cannot silently bypass the audited
  # surface; any new transitive crate that isn't covered by the imported
  # audit feeds (mozilla, google, embark, bytecode-alliance, isrg,
  # zcash) OR an explicit `[[exemptions.X]]` row in `config.toml` fails
  # the build. See `docs/security/supply-chain.md` "Updating the
  # cargo-vet baseline" for the standing operator workflow.
  vet:
    name: cargo-vet
    # GitHub-hosted: the self-hosted runner's network corrupts the cargo-vet
    # tarball in transit (sha256 mismatch on a download that verifies clean
    # elsewhere; cargo-audit/cargo-deny use different URLs and are unaffected).
    # Pure-CI audit — no self-hosted HW needed — so use a reliable network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-vet-tool
      # Build from crates.io rather than a prebuilt binary: the baseline
      # `imports.lock` is generated locally with cargo-vet 0.10.2, whose
      # publisher-entry schema (optional `user-id`) the only prebuilt the
      # tool ecosystem ships — 0.10.0 — cannot parse ("missing field
      # `user-id`"). mozilla/cargo-vet never cut a GitHub release for 0.10.1+,
      # so source-build is the only way to get a version matching the lock.
      # Keep this pin in lockstep with the version used to regenerate the
      # baseline (see docs/security/supply-chain.md).
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet@0.10.2
      - name: Run cargo-vet
        run: cargo vet --locked

  # ── 4. cargo-geiger — quantify unsafe surface (informational signal). ────
  geiger:
    name: cargo-geiger (unsafe surface)
    runs-on: [self-hosted, Linux, X64]
    continue-on-error: true   # geiger is a *report*, not a gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: geiger
      - name: Install build deps
        run: |
          # Self-hosted runners typically have these pre-installed and may
          # lack passwordless sudo, so only reach for apt when something is
          # actually missing — and don't hard-fail the step if sudo is
          # unavailable (the later cargo step surfaces any real gap).
          if ! command -v cmake >/dev/null || ! command -v pkg-config >/dev/null; then
            sudo apt-get update && \
            sudo apt-get install -y cmake pkg-config build-essential libssl-dev || \
            echo "::warning::could not apt-get build deps; relying on pre-installed toolchain"
          fi
      # Prebuilt binary, not `cargo install` from source: building the tool on
      # the self-hosted runners is the flaky step (intermittent "No such file or
      # directory (os error 2)" mid-compile). Mirrors the cargo-audit/cargo-vet jobs.
      - name: Install cargo-geiger
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-geiger
      - name: Geiger report
        run: cargo geiger --all-features --output-format Json > geiger.json || true
      - name: Upload geiger report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-geiger-report
          path: geiger.json
          retention-days: 30

  # ── 5. CycloneDX SBOM — on master + release tags. Attached to releases. ──
  sbom:
    name: SBOM (CycloneDX)
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sbom
      - name: Install build deps
        run: |
          # Self-hosted runners typically have these pre-installed and may
          # lack passwordless sudo, so only reach for apt when something is
          # actually missing — and don't hard-fail the step if sudo is
          # unavailable (the later cargo step surfaces any real gap).
          if ! command -v cmake >/dev/null || ! command -v pkg-config >/dev/null; then
            sudo apt-get update && \
            sudo apt-get install -y cmake pkg-config build-essential libssl-dev || \
            echo "::warning::could not apt-get build deps; relying on pre-installed toolchain"
          fi
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM (JSON, all features)
        # `cargo-cyclonedx --override-filename FOO --format json` writes
        # `FOO.json` in the manifest dir (no `.cdx.` infix). Rename to the
        # CycloneDX-conventional filename for downstream consumers.
        run: |
          cargo cyclonedx --all --format json --override-filename zion-sbom
          test -s zion-sbom.json
          mv zion-sbom.json zion-sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: "zion-sbom.cdx.json"
          retention-days: 90

  # OSSF Scorecard moved to its own workflow file
  # (.github/workflows/scorecard.yml) on issue #57: scorecard-action's
  # `publish_results: true` requires a minimal workflow (no global
  # `env:` / `defaults:`), which this file's `env: CARGO_TERM_COLOR`
  # block prevents. The split lets the public scorecard.dev badge
  # auto-refresh while keeping the rest of the supply-chain audits
  # under their consolidated banner.
