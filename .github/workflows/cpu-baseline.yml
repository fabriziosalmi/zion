# Do the binaries we ship run on the oldest processor of their architecture? (#662)
#
# Until v0.12.0 the Linux x86_64 tarballs and the amd64 image were compiled with
# `-C target-cpu=x86-64-v3` and stopped with an illegal instruction on a processor without
# AVX2, before printing a word. Nothing checked it and nothing documented it.
#
# The release runs scripts/cpu-baseline-smoke.sh on every artefact it builds. This workflow
# runs the same script on a pull request that touches what decides the answer, so that a
# flag which narrows the processors is found before a tag, not by the release:
#
#   artefact  a tarball's binary, built as release.yml builds it, served under an emulated
#             processor with SSE2 and nothing later.
#   image     the binary of the image the Dockerfile builds, the same way.
#   control   the script must refuse a binary known to need AVX2: the published v0.12.0
#             one. A script that accepts everything would pass the two jobs above too.
#
# If the toolchain pins below change, change them in release.yml in the same commit: the
# artefact job is only meaningful while it builds the way the release does.
name: cpu-baseline

on:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "build.rs"
      - "Dockerfile"
      - "rust-toolchain.toml"
      - "scripts/cpu-baseline-smoke.sh"
      - ".github/workflows/cpu-baseline.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  artefact:
    name: artefact (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As release.yml: the explicit pin below is the compiler, and the toolchain file would
      # make rustup ignore the target added with it.
      - name: Drop dev toolchain pin, as the release build does
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cpu-baseline-${{ matrix.target }}

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Install build deps and the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config build-essential qemu-user

      - name: Build as the release does
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release --locked --features dist --target "${TARGET}"

      - name: Declared, and served under an emulated baseline CPU
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/cpu-baseline-smoke.sh "target/${TARGET}/release/zion"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          docker build \
            --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" \
            --build-arg "ZION_GIT_SHA=$(git rev-parse --short=12 HEAD)" \
            --build-arg "ZION_COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)" \
            -t zion:cpu-baseline .

      - name: Take the binary out of the image
        run: |
          docker create --name extract zion:cpu-baseline >/dev/null
          docker cp extract:/usr/local/bin/zion "${RUNNER_TEMP}/zion" >/dev/null
          docker rm extract >/dev/null
          file -b "${RUNNER_TEMP}/zion"

      - name: Declared, and served under an emulated baseline CPU
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y qemu-user >/dev/null
          # rust-toolchain.toml is in this checkout: `rustc` is the compiler the image was
          # built with, and the script asks it for the target's default features.
          rustup toolchain install >/dev/null 2>&1 || true
          rustc --version
          bash scripts/cpu-baseline-smoke.sh "${RUNNER_TEMP}/zion"

  control:
    name: control (the script refuses a build that needs AVX2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # v0.12.0's Linux x86_64 binaries were compiled with -C target-cpu=x86-64-v3.
      - name: Download the published v0.12.0 binary
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: zion-v0.12.0-x86_64-unknown-linux-musl.tar.gz
        run: |
          mkdir -p "${RUNNER_TEMP}/v0.12.0"
          cd "${RUNNER_TEMP}/v0.12.0"
          gh release download v0.12.0 --repo "${GITHUB_REPOSITORY}" -p "${ARCHIVE}" -p SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "${ARCHIVE}"

      - name: The script must refuse it, for the right reason
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y qemu-user >/dev/null
          set +e
          bash scripts/cpu-baseline-smoke.sh "${RUNNER_TEMP}/v0.12.0/zion" 2>&1 | tee "${RUNNER_TEMP}/control.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::The script accepted a binary compiled for x86-64-v3"
            exit 1
          fi
          # Refused, and because the binary met an instruction the emulated CPU lacks: not
          # because a tool was missing or the control program did not compile.
          grep -q "control: an AVX2 instruction stops under -cpu Opteron_G1" "${RUNNER_TEMP}/control.log"
          grep -q "illegal instruction" "${RUNNER_TEMP}/control.log"
          echo "Refused as expected (status ${status})"
