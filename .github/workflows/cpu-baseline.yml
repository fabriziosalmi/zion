# Do the binaries we ship run on the oldest processor of their architecture? (#662)
#
# Until v0.12.0 the Linux x86_64 tarballs and the amd64 image were compiled with
# `-C target-cpu=x86-64-v3` and stopped with an illegal instruction on a processor without
# AVX2, before printing a word; the aarch64 ones with `neoverse-n1`, and stopped on a
# Cortex-A53 or A72 (#666). Nothing checked it and nothing documented it.
#
# The release runs scripts/cpu-baseline-smoke.sh on every artefact it builds. This workflow
# runs the same script on a pull request that touches what decides the answer, so that a
# flag which narrows the processors is found before a tag, not by the release:
#
#   artefact  a tarball's binary, built as release.yml builds it, served under an emulated
#             processor with the architecture's baseline and nothing later (SSE2; a
#             Cortex-A53).
#   image     the binary of the image the Dockerfile builds, the same way.
#   declared  macOS and Windows binaries cannot be run on an emulated old processor here:
#             for them the check is what the binary declares. This job makes the same
#             check on a pull request, with the compiler flags of the release.
#   control   the script must refuse a binary known to need more: the published v0.12.0
#             ones. A script that accepts everything would pass the jobs above too.
#
# If the toolchain pins below change, change them in release.yml in the same commit: the
# artefact job is only meaningful while it builds the way the release does.
name: cpu-baseline

on:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "build.rs"
      - "Dockerfile"
      - "rust-toolchain.toml"
      - "scripts/cpu-baseline-smoke.sh"
      - ".github/workflows/cpu-baseline.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  artefact:
    name: artefact (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As release.yml: the explicit pin below is the compiler, and the toolchain file would
      # make rustup ignore the target added with it.
      - name: Drop dev toolchain pin, as the release build does
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cpu-baseline-${{ matrix.target }}

      - name: Setup zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Install build deps and the emulator
        run: |
          sudo apt-get update
          # libc6-arm64-cross: what a dynamically linked aarch64 binary loads on this runner.
          sudo apt-get install -y cmake pkg-config build-essential qemu-user libc6-arm64-cross

      - name: Build as the release does
        env:
          TARGET: ${{ matrix.target }}
        run: |
          var="CARGO_TARGET_$(tr 'a-z.-' 'A-Z__' <<<"$TARGET")_RUSTFLAGS"
          export "${var}=$(bash scripts/remap-rustflags.sh)" ZIG_GLOBAL_CACHE_DIR="${RUNNER_TEMP}/zig-cache"
          cargo zigbuild --release --locked --features dist --target "${TARGET}"

      - name: Declared, and served under an emulated baseline CPU
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/cpu-baseline-smoke.sh "target/${TARGET}/release/zion"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: |
          docker build \
            --build-arg "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" \
            --build-arg "ZION_GIT_SHA=$(git rev-parse --short=12 HEAD)" \
            --build-arg "ZION_COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)" \
            -t zion:cpu-baseline .

      - name: Take the binary out of the image
        run: |
          docker create --name extract zion:cpu-baseline >/dev/null
          docker cp extract:/usr/local/bin/zion "${RUNNER_TEMP}/zion" >/dev/null
          docker rm extract >/dev/null
          file -b "${RUNNER_TEMP}/zion"

      - name: Declared, and served under an emulated baseline CPU
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y qemu-user >/dev/null
          # rust-toolchain.toml is in this checkout: `rustc` is the compiler the image was
          # built with, and the script asks it for the target's default features.
          rustup toolchain install >/dev/null 2>&1 || true
          rustc --version
          bash scripts/cpu-baseline-smoke.sh "${RUNNER_TEMP}/zion"

  declared:
    name: declared (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The flags are the ones release.yml gives each target. If they change there,
          # change them here.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: zion.exe
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: zion
            rustflags: "-C target-cpu=penryn"
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: zion
            rustflags: "-C target-cpu=apple-m1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Drop dev toolchain pin, as the release build does
        shell: bash
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cpu-baseline-${{ matrix.target }}

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      # A debug build: what the binary declares comes from the compiler flags, which are
      # the release's (RUSTFLAGS below, .cargo/config.toml), not from the profile.
      - name: Build with the release's compiler flags
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MATRIX_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [[ -n "$MATRIX_RUSTFLAGS" ]]; then export RUSTFLAGS="$MATRIX_RUSTFLAGS"; fi
          cargo build --locked --features dist --target "${TARGET}"

      - name: Declared
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SMOKE_MODE: declare
        run: bash scripts/cpu-baseline-smoke.sh "target/${TARGET}/debug/${ARTIFACT}"

  control:
    name: control (the script refuses the v0.12.0 ${{ matrix.arch }} build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.12.0's Linux binaries were compiled with -C target-cpu=x86-64-v3 and
          # -C target-cpu=neoverse-n1.
          - arch: x86_64
            archive: zion-v0.12.0-x86_64-unknown-linux-musl.tar.gz
            refusal: "control: an AVX2 instruction stops under -cpu Opteron_G1"
            packages: qemu-user
          - arch: aarch64
            archive: zion-v0.12.0-aarch64-unknown-linux-musl.tar.gz
            refusal: "control: an LSE instruction stops under -cpu cortex-a53"
            packages: qemu-user gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the published v0.12.0 binary
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p "${RUNNER_TEMP}/v0.12.0"
          cd "${RUNNER_TEMP}/v0.12.0"
          gh release download v0.12.0 --repo "${GITHUB_REPOSITORY}" -p "${ARCHIVE}" -p SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "${ARCHIVE}"

      - name: The script must refuse it, for the right reason
        env:
          PACKAGES: ${{ matrix.packages }}
          REFUSAL: ${{ matrix.refusal }}
        run: |
          sudo apt-get update >/dev/null
          # shellcheck disable=SC2086  # a list of package names
          sudo apt-get install -y $PACKAGES >/dev/null
          set +e
          bash scripts/cpu-baseline-smoke.sh "${RUNNER_TEMP}/v0.12.0/zion" 2>&1 | tee "${RUNNER_TEMP}/control.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::The script accepted a binary compiled for a newer processor"
            exit 1
          fi
          # Refused, and because the binary met an instruction the emulated CPU lacks: not
          # because a tool was missing or the control program did not compile.
          grep -qF "$REFUSAL" "${RUNNER_TEMP}/control.log"
          grep -q "illegal instruction" "${RUNNER_TEMP}/control.log"
          echo "Refused as expected (status ${status})"
