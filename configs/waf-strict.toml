# ============================================================================
# ZION EDGE GATEWAY — WAF Strict Configuration
# ============================================================================
# TLS proxy + strict WAF on all API routes.
# JSON-only API, no file uploads, tight depth limits.

[server]
listen_http = "0.0.0.0:80"
listen_https = "0.0.0.0:443"

[tls]
cert_path = "/etc/ssl/zion/tls.crt"
key_path = "/etc/ssl/zion/tls.key"
hot_reload = true
min_version = "1.3"
alpn = ["h2", "http/1.1"]

# ── Upstreams ──

[upstream.api]
url = "http://127.0.0.1:8000"
connect_timeout_ms = 3000
keepalive = 64

[upstream.frontend]
url = "http://127.0.0.1:3000"
connect_timeout_ms = 2000
keepalive = 32

# ── WAF Profiles ──

[waf_profile.strict]
max_body_mb = 10
max_depth = 10
max_string_len = 1048576
deny_unknown_content_types = true
allowed_content_types = ["application/json", "multipart/form-data"]

# ── Routes ──

[[route]]
path = "/api/{*rest}"
upstream = "api"
waf_profile = "strict"

[[route]]
path = "/{*rest}"
upstream = "frontend"
