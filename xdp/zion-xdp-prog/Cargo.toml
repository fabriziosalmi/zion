[package]
name = "zion-xdp-prog"
version = "0.1.0"
edition = "2021"
description = "eBPF/XDP pre-filter for Zion (drops blacklisted CIDRs at the NIC driver layer)"
publish = false

# This crate is intentionally NOT a member of the zion package — it is a
# standalone cargo project that targets `bpfel-unknown-none` and requires
# `bpf-linker`. Build it via `xdp/build.sh`; see xdp/README.md.
[workspace]

[dependencies]
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
network-types = "0.0.7"

[[bin]]
name = "zion-xdp-prog"
path = "src/main.rs"

# Required eBPF link/compile profile.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
