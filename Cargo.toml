[package]
name = "zion"
version = "0.1.8"
edition = "2021"
license = "Apache-2.0"
description = "High-performance Rust TLS reverse proxy with built-in WAF and sovereign edge intelligence."
repository = "https://github.com/fabriziosalmi/zion"
authors = ["Fabrizio Salmi"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/1.1 server + client
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

# Radix tree routing (same engine as Axum)
matchit = "0.8"

# TLS + hot-reload
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
arc-swap = "1"
notify = "7"

# AEAD primitives for the boot-time AES-GCM calibration microbench.
# Already pulled in transitively via rustls — declaring it here only
# enables direct API access, no extra binary footprint.
aws-lc-rs = "1"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Lock-free concurrent cache
dashmap = "6"

# High-performance allocator — 2-3x faster than system malloc on small allocs
mimalloc = { version = "0.1", default-features = false }

# Socket tuning
socket2 = { version = "0.5", features = ["all"] }

# WAF: Aho-Corasick multi-pattern scanner — O(N) single-pass, no regex
aho-corasick = "1"

# Fast byte search (used by WAF for encoding detection)
memchr = "2"

# FNV hash — ~2x faster than SipHash for short keys (SNI hostnames)
fnv = "1"

# Upstream TLS root CAs (embedded Mozilla bundle — deterministic, no system dep)
webpki-roots = "0.26"

# Upstream HTTPS connector — enables HTTP/2 multiplexing to TLS upstreams
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-roots", "ring"], default-features = false }

# WAF: SIMD-accelerated JSON validation (10x faster than serde_json for validation)
simd-json = "0.14"
itoa = "1.0.18"
ryu = "1.0.23"
tokio-stream = "0.1.18"
core_affinity = "0.8"
# ACME auto-renewal (opt-in: cargo build --features acme)
instant-acme = { version = "0.8", features = ["hyper-rustls"], optional = true }
rcgen = { version = "0.14", optional = true }
base64 = { version = "0.22", optional = true }

# Auth-gate JWT/OIDC (opt-in: cargo build --features auth)
jsonwebtoken = { version = "9", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

# HTTP/3 QUIC (opt-in: cargo build --features http3)
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# Live TUI dashboard (opt-in: cargo build --features tui)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = { version = "0.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
default = []
io-uring-accept = ["io-uring"]
acme = ["instant-acme", "rcgen", "base64"]
auth = ["jsonwebtoken", "reqwest"]
http3 = ["quinn", "h3", "h3-quinn"]
reqwest = ["dep:reqwest"]
tui = ["ratatui", "crossterm"]
init = ["rcgen"]
# Sovereign Edge Intelligence — bake regional ASN/CIDR data into the binary
geo-ita = []                       # 🇮🇹 Italian ASN + gov + ISP ranges
geo-eu  = ["geo-ita"]              # 🇪🇺 EU superset (includes geo-ita)
sovereign-signals = []             # Gossip mesh for signal sharing (Phase 3)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
