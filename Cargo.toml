[package]
name = "zion"
version = "0.3.1"
edition = "2021"
# MSRV is the *core* default-features build (TLS proxy + WAF + cache + metrics).
# Opt-in features (acme, auth, init, http3) pull crypto/i18n crates that have
# their own, faster-moving MSRV (currently 1.88 — `time`, `darling`, `icu_*`).
# The CI MSRV job enforces this 1.82 floor against `--no-default-features` only.
rust-version = "1.82"
license = "Apache-2.0"
description = "High-performance Rust TLS reverse proxy with built-in WAF and sovereign edge intelligence."
repository = "https://github.com/fabriziosalmi/zion"
homepage = "https://fabriziosalmi.github.io/zion"
documentation = "https://fabriziosalmi.github.io/zion"
authors = ["Fabrizio Salmi"]
readme = "README.md"
keywords = ["proxy", "tls", "waf", "http3", "reverse-proxy"]
categories = ["network-programming", "web-programming::http-server"]
exclude = [
    ".github/**",
    ".gitlab-ci.yml",
    "benchmarks/**",
    "docs/**",
    "deploy/**",
    "tests/**",
    "scripts/**",
    "examples/**",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/1.1 server + client
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

# Radix tree routing (same engine as Axum)
matchit = "0.8"

# TLS + hot-reload
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
arc-swap = "1"
notify = "7"

# AEAD primitives for the boot-time AES-GCM calibration microbench.
# Already pulled in transitively via rustls — declaring it here only
# enables direct API access, no extra binary footprint.
aws-lc-rs = "1"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Lock-free concurrent cache
dashmap = "6"

# High-performance allocator — 2-3x faster than system malloc on small allocs
mimalloc = { version = "0.1", default-features = false }

# Socket tuning
socket2 = { version = "0.5", features = ["all"] }

# WAF: Aho-Corasick multi-pattern scanner — O(N) single-pass, no regex
aho-corasick = "1"

# Fast byte search (used by WAF for encoding detection)
memchr = "2"

# FNV hash — ~2x faster than SipHash for short keys (SNI hostnames)
fnv = "1"

# Upstream TLS root CAs (embedded Mozilla bundle — deterministic, no system dep)
webpki-roots = "0.26"

# Upstream HTTPS connector — enables HTTP/2 multiplexing to TLS upstreams
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-roots", "ring"], default-features = false }

# WAF: SIMD-accelerated JSON validation (10x faster than serde_json for validation)
simd-json = "0.14"
itoa = "1.0.18"
ryu = "1.0.23"
tokio-stream = "0.1.18"
core_affinity = "0.8"
# ACME auto-renewal (opt-in: cargo build --features acme)
instant-acme = { version = "0.8", features = ["hyper-rustls"], optional = true }
rcgen = { version = "0.14", optional = true }
base64 = { version = "0.22", optional = true }

# Auth-gate JWT/OIDC (opt-in: cargo build --features auth)
# v10 requires explicitly choosing a CryptoProvider; we pick aws_lc_rs to
# stay aligned with rustls's backend (and the FIPS build path), avoiding a
# dual-provider runtime panic that v10 enforces if neither is selected.
jsonwebtoken = { version = "10", optional = true, default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

# HTTP/3 QUIC (opt-in: cargo build --features http3)
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# Live TUI dashboard (opt-in: cargo build --features tui)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# ── Observability (Track B) ────────────────────────────────────────────
# `tracing` is always-on: it gives us spans + structured events with
# zero runtime cost when no subscriber is attached. The default subscriber
# (built in observability.rs) renders JSON to stderr and is always linked.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry", "ansi"] }

# OTLP gRPC export — opt-in. Pulls in tonic/prost; we keep it gated so the
# default binary stays lean. Enable with `--features otel`.
# Since 0.28 the batch span processor runs on a dedicated background thread,
# so the SDK no longer needs an `rt-tokio` runtime feature (grpc-tonic still
# requires a Tokio runtime to exist at export time, which the daemon provides).
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = { version = "0.7", optional = true }
# XDP / eBPF userspace loader (Track A — `--features xdp`).
# Aya is pure-Rust (no libbpf C dep) and ships its own BTF loader.
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }
# kTLS post-handshake offload (Track A — `--features ktls`).
# Bridges a rustls ServerConnection to the kernel's TLS_TX/RX so that
# subsequent record encrypt/decrypt happens in-kernel (sendfile-style
# zero-copy enabled). Linux-only; kernel >= 5.10 with CONFIG_TLS=y.
ktls = { version = "6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Track C: ML-augmented WAF scoring (`--features ml-waf`).
# `tract` is pure-Rust ONNX inference — no libonnxruntime C dep, hermetic
# build, deterministic across platforms. Loads quantized models on the
# request hot path with a strict per-request budget (see waf_ml.rs).
[dependencies.tract-onnx]
version = "0.21"
optional = true
default-features = false

# Track B: AIMP serverless control plane (`--features sovereign-aimp`).
# Pinned to a specific commit on the public `fabriziosalmi/aimp` repo
# so CI / fresh clones don't need a sibling working copy. Treat as
# experimental: the protocol is research-grade (Merkle-CRDT + Epistemic
# Layer L3) and the upstream API is not yet semver-stable.
[dependencies.aimp_node]
version = "0.1"
git = "https://github.com/fabriziosalmi/aimp"
# Pin includes:
#   * 9408956…  `license = "MIT"` in aimp_node/Cargo.toml (cargo-deny).
#   * 4631819…  `Identity::from_secret_bytes` + `secret_bytes` so
#               zion can persist the Ed25519 seed across restarts.
rev = "46318198785f8600c08af8c90533795316f4b1b3"
package = "aimp_node"
optional = true

# rmp-serde — MessagePack codec used by AIMP envelopes. Pulled in
# directly so zion can construct/parse `AimpEnvelope`s without going
# through aimp_node's private module path.
[dependencies.rmp-serde]
version = "1"
optional = true

[features]
default = []
io-uring-accept = ["io-uring"]
# v0.2 perf-ceiling — io_uring read/write vectored (issue #51).
#
# Wires the boot-time probe (kernel >= 5.19, where IORING_OP_READV_FIXED
# and the rest of the rw surface we'd target are stable) and reserves
# the feature gate. The full `IoUringStream<R, W>` adapter that
# replaces the tokio-driven read/write half of accepted connections is
# tracked on a follow-up — it requires a careful tokio-reactor
# integration we don't paper over with a delegating stub.
#
# Until that follow-up lands, this feature only enables the boot
# capability probe and the kernel-version structured log line. The
# listener supervisor keeps using tokio's `AsyncReadExt` /
# `AsyncWriteExt` — no behavioural change at runtime.
io-uring-rw = ["io-uring-accept"]
acme = ["instant-acme", "rcgen", "base64"]
auth = ["jsonwebtoken", "reqwest"]
http3 = ["quinn", "h3", "h3-quinn"]
reqwest = ["dep:reqwest"]
tui = ["ratatui", "crossterm"]
init = ["rcgen"]
# Distributed tracing export to an OTLP collector (Tempo, Jaeger, Honeycomb,
# Datadog Agent, etc). The base `tracing` integration is always-on; this
# feature only enables the network exporter.
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry"]
# FIPS 140-3 mode (Track E). Switches the aws-lc-rs backend to its
# FIPS-validated build (aws-lc-fips-sys). Requires:
#   * a CMake + clang toolchain capable of building the FIPS module from
#     source (the build script verifies the integrity hash at compile time);
#   * the FIPS module's algorithm restrictions (no ChaCha20-Poly1305 for
#     TLS 1.2 record-layer, etc.) — TLS 1.3 ciphers are unaffected.
# See docs/security/fips.md for the full conformance posture.
fips = ["aws-lc-rs/fips"]
# Sovereign Edge Intelligence — bake regional ASN/CIDR data into the binary
geo-ita = []                       # 🇮🇹 Italian ASN + gov + ISP ranges
geo-eu  = ["geo-ita"]              # 🇪🇺 EU superset (includes geo-ita)
sovereign-signals = []             # Gossip mesh for signal sharing (Phase 3)

# ── Experimental tracks ───────────────────────────────────────────────
# Track A — XDP pre-filter: drops blacklisted CIDRs at the NIC driver
# layer before the kernel network stack. Linux-only. Requires CAP_NET_ADMIN
# at runtime; the eBPF program is shipped separately under `xdp/` and
# loaded from disk (or embedded — see xdp.rs::EBPF_OBJECT_PATH).
xdp = ["dep:aya", "dep:aya-log"]
# v0.2 perf-ceiling — SO_REUSEPORT + BPF demux for unified :443 (issue
# #53). Loads a small `SK_REUSEPORT` program that overrides the
# kernel's default reuseport hash on the SO_REUSEPORT group bound on
# :443 so connection→worker affinity can be steered from userspace
# (gossip-driven, NUMA-aware, etc — all follow-up). The runtime
# listener wire-up that consumes the loader is deferred — see
# CHANGELOG. Linux >= 5.7 (when SO_ATTACH_REUSEPORT_EBPF gained UDP
# support, matching the issue's QUIC integration requirement).
bpf-demux = ["dep:aya"]
# Track A — kTLS post-handshake offload. Linux >= 5.10 + CONFIG_TLS.
# Switches established rustls server connections to in-kernel TLS_TX/RX.
#
# Now depends on `io-uring-rw` per the issue #52 spec — the io_uring rw
# adapter is the natural buddy for sendfile-style zero-copy on
# cacheable static responses. The runtime adapter itself is deferred
# (see #51 Deferred), but the dependency keeps the feature graph
# honest: enabling kTLS implies opting into the io_uring rw track.
ktls = ["io-uring-rw", "dep:ktls"]
# v0.2 perf-ceiling — NUMA-aware DashMap sharding (issue #50).
# Splits `rate_map` and `inflight` into per-node shards, routed by the
# calling thread's NUMA node. Single-socket / non-Linux: transparent
# (1 shard). Reads `/sys/devices/system/node/` directly — no libnuma
# dep — see src/numa.rs for the design rationale.
numa-aware = []
# Track C — ML-augmented WAF scoring. Loads a quantized ONNX model and
# scores requests on the hot path with a strict latency budget.
ml-waf = ["dep:tract-onnx"]
# Track B — AIMP-as-control-plane. Bootstraps an aimp_node task for
# serverless gossip of WAF rules / IP reputation / threat intel via
# Merkle-CRDT. Implies sovereign-signals (the existing Phase 3 hook).
sovereign-aimp = ["sovereign-signals", "dep:aimp_node", "dep:rmp-serde"]

# Track C — property-based testing (proptest) only used by `cargo test`.
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Criterion microbench harness (issue #54). Pinned to 0.5; the `html_reports`
# default feature is dropped — we publish a JSON baseline (target/criterion/
# *.json) and the GitHub Actions runner has no browser to render HTML in.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# DashMap is also a runtime dep, but the cache-lookup bench needs to construct
# its own L2-shaped fixture without dragging in `crate::cache` (which pulls
# bootstrap/metrics/reload). Listing it here is a no-op for the binary.

# ─── Microbenchmark targets (issue #54) ──────────────────────────────────
# `harness = false` disables the libtest harness so `criterion::criterion_main!`
# can take over. Each entry maps to a file under `benches/`.
[[bench]]
name = "waf_streaming"
harness = false

[[bench]]
name = "sovereign"
harness = false

[[bench]]
name = "traceparent"
harness = false

[[bench]]
name = "audit_hmac"
harness = false

[[bench]]
name = "cache_lookup"
harness = false

[[bench]]
name = "numa"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Bench profile inherits release optimizations but keeps debug info enabled
# for flamegraph/perf attribution. Same opt-level as release ensures bench
# numbers reflect the shipped binary, not a debug build.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = true
